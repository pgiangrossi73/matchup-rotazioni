<!doctype html>
<html lang="it" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important} img{max-width:100%}</style>
<title>Setter Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f1b33">
<meta name="google" content="notranslate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: digitalizza il foglio di Lino. Sinistra: loro metà campo in verticale (ricezione, zona+qualità) e barra del passo corrente. Destra: rotazioni, segnale per corsia, 6 riquadri-chiamata (loro fascia a rete + nostra metà) dove si tracciano le traiettorie. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --sunk: #e3e8f1; --ink: #13203a; --muted: #5a6683; --line: #d3dae7;
  --court: #2d62b8; --court-us: #3a6fc4; --court-line: rgba(255,255,255,.85); --free: #e6ebf3;
  --accent: #ef6a2a; --accent-ink: #ffffff;
  --lane-a: #2c6bd9; --lane-b: #d6433b; --lane-c: #17936a; --lane-f: #2b2f3a;
  --sig-4: #ef6a2a; --sig-2: #7a4ce0; --sig-fist: #c23a33; --sig-read: #4b5876;
  --k-p: #c8a21a; --bad: #d6433b;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1324; --surface: #121d33; --sunk: #1a2742; --ink: #e9eefb; --muted: #95a3c2; --line: #263453;
  --court: #1f4a8f; --court-us: #24529c; --court-line: rgba(255,255,255,.7); --free: #101a2e;
  --accent: #ff8045; --accent-ink: #1a0e05;
  --lane-a: #4a86f0; --lane-b: #f0605a; --lane-c: #2cc08b; --lane-f: #e9eefb;
  --sig-4: #ff8045; --sig-2: #9775ff; --sig-fist: #e5544b; --sig-read: #6c7a9b;
  --k-p: #e0bb34; --bad: #f0605a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1324; --surface: #121d33; --sunk: #1a2742; --ink: #e9eefb; --muted: #95a3c2; --line: #263453;
  --court: #1f4a8f; --court-us: #24529c; --court-line: rgba(255,255,255,.7); --free: #101a2e;
  --accent: #ff8045; --accent-ink: #1a0e05;
  --lane-a: #4a86f0; --lane-b: #f0605a; --lane-c: #2cc08b; --lane-f: #e9eefb;
  --sig-4: #ff8045; --sig-2: #9775ff; --sig-fist: #e5544b; --sig-read: #6c7a9b;
  --k-p: #e0bb34; --bad: #f0605a; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.35; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)) }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 4px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 9px; margin-right: auto }
.brand svg { width: 34px; height: 34px; flex: none }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; line-height: 1 }
.brand h1 b { color: var(--accent) }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 11px }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted) }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.lang { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; font-family: var(--f-display); font-weight: 600; letter-spacing: .05em; min-height: 40px }

main { padding-block: 8px 20px }
.idlebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.idlebar .btn { min-height: 46px; padding: 4px 6px; font-size: 14px; line-height: 1.1 }
.rwrap { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px }
.rotbox { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; height: 58px; flex: 0 0 58px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.rotbox .rotb { border-style: solid; color: var(--ink) }
@media (max-width: 1150px) { .rotbox small { display: none } }
.rotbox b { font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1 } .rotbox small { font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; font-weight: 600 } .rotbox .exbtn { margin-top: 0; font-size: 14px; padding: 6px 10px }
.stepfull { overflow: auto }

.view[hidden] { display: none }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.disp { font-family: var(--f-display); font-weight: 700; letter-spacing: .02em }
.muted { color: var(--muted) }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; min-height: 44px; font-weight: 600 }
.btn:active { transform: translateY(1px) }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { background: transparent }
.btn.big { min-height: 56px; font-family: var(--f-display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase }
.btn[disabled] { opacity: .4; cursor: default }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px }

/* ---------- live layout ---------- */
.live { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 12px; align-items: start }
@media (max-width: 900px) { .live { grid-template-columns: minmax(0, 1fr) } }
.left, .right { display: grid; gap: 10px; min-width: 0 }
.score { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; justify-content: space-between }
.score .n { font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; text-align: center }
.score .who { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; text-align: center; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.score .serve { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 4px; vertical-align: middle }
.srvtog { border: 1px dashed var(--line); background: transparent; border-radius: 9px; padding: 4px 8px; min-height: 40px; font-size: 12px }

/* reception court: their half, vertical, net at bottom */
.rcourt { position: relative; aspect-ratio: 1 / 1; width: 100%; background: var(--court); border: 2px solid var(--court-line); border-bottom: 6px solid #fff; border-radius: 4px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr) }
.rcourt::after { content: ""; position: absolute; left: 0; right: 0; bottom: 33.33%; border-top: 2px solid var(--court-line); pointer-events: none }
.zone { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 3px; padding: 17px 4px 4px; border-right: 1px dashed rgba(255,255,255,.3); border-bottom: 1px dashed rgba(255,255,255,.3) }
.zone .zn { position: absolute; left: 6px; top: 0; font-family: var(--f-display); font-weight: 700; font-size: 14px; color: #fff; opacity: .85; pointer-events: none }
.zone button.q { border: 0; border-radius: 6px; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: clamp(15px, 1.7vw, 21px); line-height: 1; padding: 0; min-height: 0 }
.zone button.q:active { filter: brightness(1.25) }
.lane-a button.q { background: var(--lane-a) } .lane-b button.q { background: var(--lane-b) } .lane-c button.q { background: var(--lane-c) }
.rcourt.off button.q { opacity: .2; pointer-events: none }
.photo-ov { position: fixed; inset: 0; z-index: 60; background: rgba(8,14,28,.55); display: grid; place-items: center; padding: 12px }
.photo { width: min(980px, 100%); max-height: calc(100dvh - 24px); overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.4) }
.pgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px }
@media (max-width: 760px) { .pgrid { grid-template-columns: minmax(0, 1fr) } }
.plan6 { display: grid; gap: 6px }
.prow { display: grid; grid-template-columns: 58px 34px 1fr; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 6px; border-radius: 8px }
.prow.now { background: var(--sunk); outline: 2px solid var(--accent) }
.prow small { display: block; font-size: 9.5px; color: var(--accent); text-transform: uppercase; letter-spacing: .04em }
.prow .g { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 20px }
.prow .g svg { width: 62%; height: 62%; fill: currentColor }
.prow .g.warn { background: transparent !important; color: var(--muted); border: 2px dashed var(--line) }
.rcourt .zsel { outline: 3px solid #fff; outline-offset: -3px; z-index: 1 }
.rcourt .zsel button.q { opacity: .55 }
.rpop { position: absolute; left: 3%; right: 3%; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.45); padding: 10px }
.rpop.r0 { top: 34% } .rpop.r1 { top: 67% } .rpop.r2 { bottom: 34% }
.rpop h4 { font-size: 17px } .rpop .hint { display: none } .rpop .nums { grid-template-columns: repeat(4, 1fr) } .rpop .num { min-height: 46px } .rpop .foot { margin-top: 6px }
.rcourt.o1 { border-bottom: 2px solid var(--court-line); border-right: 6px solid #fff } .rcourt.o1::after { left: auto; top: 0; bottom: 0; right: 33.33%; border-top: 0; border-left: 2px solid var(--court-line) }
.rcourt.o2 { border-bottom: 2px solid var(--court-line); border-top: 6px solid #fff } .rcourt.o2::after { bottom: auto; top: 33.33%; border-top: 2px solid var(--court-line) }
.rcourt.o3 { border-bottom: 2px solid var(--court-line); border-left: 6px solid #fff } .rcourt.o3::after { right: auto; top: 0; bottom: 0; left: 33.33%; border-top: 0; border-left: 2px solid var(--court-line) }
.rcourt .rotbtn { position: absolute; top: 0; right: 0; z-index: 3; height: 22px; min-width: 34px; padding: 0 6px; border: 0; border-radius: 0 0 0 8px; background: rgba(0,0,0,.35); color: #fff; font-size: 14px; line-height: 22px; cursor: pointer; pointer-events: auto; opacity: 1 }
.score .n.ed { display: block; margin: 0 auto; background: none; border: 0; padding: 0; color: inherit; min-width: 44px; cursor: pointer; text-decoration: underline dotted rgba(127,127,127,.6); text-underline-offset: 4px }
.scedit { width: min(440px, 100%) } .scedit .scrow { display: grid; grid-template-columns: 1fr 56px 64px 56px; gap: 8px; align-items: center; margin: 8px 0 } .scedit .scrow .n { font-family: var(--f-display); font-weight: 700; font-size: 34px; text-align: center; font-variant-numeric: tabular-nums } .scedit .scrow .btn { min-height: 52px; font-size: 24px }
.rcourt .netlbl { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .1em; color: var(--muted); font-weight: 600 }

/* step bar */
.step h4 { margin: 0 0 2px; font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1 }
.step .hint { font-size: 13px; color: var(--muted); margin: 0 0 8px }
.crumbs { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px }
.crumbs .crb { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; min-height: 30px }
.rcvrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 8px } .rcvrow .lbl { grid-column: 1 / -1 }
.rcvrow button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 2px; min-height: 46px; font-size: 11px; display: grid; justify-items: center; line-height: 1.1; min-width: 0; overflow: hidden; color: var(--ink); cursor: pointer } .rcvrow button b { font-family: var(--f-display); font-size: 18px } .rcvrow button.on { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)) }
.crumbs span { background: var(--sunk); border-radius: 6px; padding: 2px 7px; font-size: 13px; font-weight: 600 }
.crumbs .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 4px }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.num { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 3px }
.num b { font-family: var(--f-display); font-size: 24px; line-height: 1 }
.num small { font-size: 10px; color: var(--muted); line-height: 1.1; text-align: center }
.num.hot { border: 2px solid var(--accent) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.outs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.outs button { min-height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 6px; padding: 4px 8px; text-align: left }
.outs svg { width: 26px; height: 26px }
.outs b { font-family: var(--f-display); font-size: 20px; line-height: 1; display: block }
.outs small { font-size: 10.5px; color: var(--muted); line-height: 1.1; display: block }
.foot { display: flex; gap: 6px; margin-top: 8px }
.foot .btn { flex: 1; min-height: 40px; font-size: 13px }
.calllist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-height: 260px; overflow: auto }
.calllist button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 8px; min-height: 46px }
.calllist b { font-family: var(--f-display); font-size: 19px; margin-right: 6px }
.calllist small { color: var(--muted); font-size: 12px }

/* right top */
.topbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.topbar .tbr { flex: 1 1 auto; justify-content: flex-end } .topbar .tbr .btn { font-size: 17px; font-weight: 700; min-height: 48px; padding: 6px 14px } .topbar .tbr .undobig { margin-right: auto }
.topbar .btn.undobig { font-size: 17px; font-weight: 700; min-height: 48px; padding: 6px 16px; border-width: 2px; border-color: var(--ink) } .topbar .btn.undobig:disabled { border-color: var(--line) }
.rots { display: flex; gap: 4px }
.rots button { width: 48px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 19px }
.rots button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.sigrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch }
.exbtn { margin-top: 4px; font-family: var(--f-body); font-size: 11px; font-weight: 700; border: 1px dashed var(--line); background: var(--sunk); color: var(--muted); border-radius: 7px; padding: 3px 6px; white-space: nowrap }
.exbtn.on { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--surface) }
.sigrow .rlab { display: grid; place-items: center; align-content: center; padding: 0 8px; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.sigrow .rlab small { font-size: 10px; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); text-transform: uppercase }
.sigc { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid; border-radius: 12px; padding: 6px 8px; min-width: 0 }
.sigc.lane-a { border-left-color: var(--lane-a) } .sigc.lane-b { border-left-color: var(--lane-b) } .sigc.lane-c { border-left-color: var(--lane-c) }
.glyph { width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 36px; line-height: 1 }
.glyph svg { width: 62%; height: 62%; fill: currentColor }
.sig-4 { background: var(--sig-4) } .sig-2 { background: var(--sig-2) } .sig-fist { background: var(--sig-fist) } .sig-read { background: var(--sig-read) }
.sigc h5 { margin: 0; font-family: var(--f-display); font-size: 17px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05 }
.sigc .sub { font-size: 11px; color: var(--muted); line-height: 1.2 }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--sunk); margin-top: 4px }
.bar span { display: block; height: 100% }
.photo .bar { height: 12px }
.vrot { display: grid; grid-template-columns: 54px 28px 1fr; align-items: center; gap: 6px; font-size: 13px } .vrot .bar { margin: 0 }
.barlbl { display: flex; margin-top: 4px; font-size: 13px; line-height: 1.2 } .barlbl span { display: block; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: clip; min-width: 0; padding: 0 1px } .barlbl b { display: block; font-weight: 700 }
.barlbl .t-L, .barlbl .t-L5 { color: var(--sig-4) } .barlbl .t-C { color: var(--sig-fist) } .barlbl .t-R, .barlbl .t-R1 { color: var(--sig-2) } .barlbl .t-P { color: var(--k-p) } .barlbl .t-D { color: var(--muted) }
.k-L { background: var(--sig-4) } .k-L5 { background: color-mix(in srgb, var(--sig-4) 45%, var(--surface)) } .k-R1 { background: color-mix(in srgb, var(--sig-2) 45%, var(--surface)) } .k-C { background: var(--sig-fist) } .k-R { background: var(--sig-2) } .k-P { background: var(--k-p) } .k-D { background: var(--muted) }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted) }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px }

/* call boards */
.boards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
@media (max-width: 1100px) { .boards { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
@media (max-width: 560px) { .boards { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.boards.c1mode { display: flex !important; flex-direction: column; align-items: center; min-height: 0; height: 100%; gap: 4px }
.cthead, .ctrow { display: grid; grid-template-columns: 52px minmax(120px, 1.6fr) minmax(110px, 1fr) minmax(90px, .8fr) 90px; gap: 6px; align-items: center }
.cthead { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 0 0 4px }
.cttab { display: grid; gap: 4px; max-height: 60vh; overflow: auto } .ctrow { font-size: 13px; padding: 3px 0; border-top: 1px solid var(--line) } .ctrow b { font-family: var(--f-display); font-size: 17px }
.ctrow input, .ctrow select { font: inherit; font-size: 13px; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 38px; min-width: 0 }
.ctrow.merged { opacity: .6 } .lnk { border: 0; background: none; color: var(--accent); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0 }
@media (max-width: 640px) { .cthead { display: none } .ctrow { grid-template-columns: 52px 1fr 1fr } }
.apop { position: absolute; z-index: 6; visibility: hidden; width: min(330px, 96%); padding: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.45); border: 2px solid var(--ink) }
.pnums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 4px } .pnums button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; min-height: 46px; padding: 3px 2px; display: grid; justify-items: center; line-height: 1.05; color: var(--ink); cursor: pointer; min-width: 0 } .pnums b { font-family: var(--f-display); font-size: 20px } .pnums small { font-size: 9.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .pnums button.on { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)) }

<script>
// ===== Setter Radar core: DVW parser + model =====
const SR = (() => {
  const nextRot = r => (r === 1 ? 6 : r - 1); // DataVolley: P1 -> P6 -> P5 ...
  // a setter is recognised by surname + shirt number (surname alone merged different players, e.g. Carraro)
  const setterKey = (last, num) => normName(last) + ' #' + num;
  function normName(s) {
    return (s || '').toUpperCase().replace(/\(.*?\)/g, ' ').replace(/[^A-Z0-9 ]/g, ' ')
      .replace(/\b(VC|V C|WOMEN|W|FC|BC)\b/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function section(lines, name) {
    const i = lines.findIndex(l => l.trim().toUpperCase() === '[3' + name + ']');
    if (i < 0) return [];
    const out = [];
    for (let j = i + 1; j < lines.length && !/^\[3/.test(lines[j]); j++) out.push(lines[j]);
    return out;
  }
  // call -> setting zone along the net
  const CALLS = {
    C: ['KC', 'K7', 'KF', 'K1', 'K2', 'KN', 'KG', 'KW', 'KA', 'K3', 'KK'],
    '2': ['KT', 'KM', 'KL', 'KB', 'KE'],
    '4': ['KP', 'KJ', 'KD', 'KS'],
    FS: ['KO']
  };
  const callZone = c => { for (const z in CALLS) if (CALLS[z].includes(c)) return z; return ''; };
  // attack start zone (attacking team's view) -> group
  const groupOf = z => z === 4 ? '4' : z === 3 ? '3' : z === 2 ? '2' : z === 8 ? 'P' : (z === 9 || z === 1) ? '1' : (z === 7 || z === 5 || z === 6) ? '5' : '';

  function parseDVW(text, fileName) {
    const lines = text.replace(/\r/g, '').split('\n');
    const mf = (section(lines, 'MATCH')[0] || '').split(';');
    const tl = section(lines, 'TEAMS').filter(l => l.trim()).map(l => l.split(';'));
    if (tl.length < 2) throw new Error('teams');
    const teams = [0, 1].map(i => ({ code: (tl[i][0] || '').trim(), name: (tl[i][1] || '').trim(), key: normName(tl[i][1]) }));
    const players = [section(lines, 'PLAYERS-H'), section(lines, 'PLAYERS-V')].map(arr => {
      const out = {};
      arr.forEach(l => {
        const f = l.split(';'); if (f.length < 14 || f[1] === '' || isNaN(+f[1])) return;
        const last = (f[9] || '').trim(), first = (f[10] || '').trim();
        out[+f[1]] = { last, first, role: (f[12] || '').trim() === 'L' ? 1 : (+f[13] || 0) };
      });
      return out;
    });
    const date = (mf[0] || '').trim();
    const id = date + '|' + teams.map(t => t.key).join('-');
    const recs = [];
    const setter = [null, null];
    const orders = [[], []]; // starting lineups of each set, in rotation order from the setter
    let pend = null;
    const fin = () => { if (pend) { delete pend.side; recs.push(pend); } pend = null; };
    for (const raw of section(lines, 'SCOUT')) {
      if (!raw.trim()) continue;
      const f = raw.split(';'); const c = f[0];
      if (/^\*\*\dset/i.test(c)) { fin(); continue; }
      const side = c[0] === '*' ? 0 : c[0] === 'a' ? 1 : -1;
      if (side < 0) continue;
      const pm = c.match(/^[*a]P(\d+)/); if (pm) { setter[side] = +pm[1]; continue; }
      if (/^[*a]z\d>LUp/.test(c)) {
        const zs = f.slice(14 + 6 * side, 20 + 6 * side).map(x => parseInt(x, 10)), sn = setter[side], i = zs.indexOf(sn);
        if (zs.length === 6 && zs.every(x => x >= 0) && i >= 0) orders[side].push([0, 1, 2, 3, 4, 5].map(k => zs[(i + k) % 6]));
        continue;
      }
      if (/^[*a]p\d+:\d+/.test(c)) { fin(); continue; }
      const sk = c.match(/^[*a](\d\d)([SREABDF])/); if (!sk) continue;
      const num = +sk[1], skill = sk[2];
      if (skill === 'R' || skill === 'F') {
        fin();
        const rot = parseInt(f[9 + side], 10);
        const sn = setter[side];
        const sp = sn != null ? players[side][sn] : null;
        if (!(rot >= 1 && rot <= 6) || !sp) continue;
        const ez = parseInt(c[10], 10);
        pend = {
          side, m: id, src: 'dvw', setter: setterKey(sp.last, sn), sName: sp.last, sNum: sn,
          team: teams[side].key, rot, q: skill === 'F' ? 'F' : (c[5] || ''),
          rz: ez >= 1 && ez <= 9 ? ez : 0, rcv: skill === 'R' ? num : -1,
          call: '', sz: '', att: -1, g: '', az: 0, ez: 0, out: ''
        };
        continue;
      }
      if (!pend) continue;
      if (side !== pend.side) { if (skill !== 'S') fin(); continue; }
      if (skill === 'E' && pend.att < 0 && !pend.call && !pend.sz) {
        const call = c.slice(6, 8);
        pend.call = /^K[A-Z0-9]$/.test(call) ? call : '';
        pend.sz = num !== pend.sNum ? 'FS' : (callZone(pend.call) || '');
        pend.est = 1; pend.setBy = num; // who actually set: only the setter's own sets count in her tendencies
      } else if (skill === 'A' && pend.att < 0) {
        const az = parseInt(c[9], 10), ez = parseInt(c[10], 10);
        pend.att = num; pend.az = az >= 1 && az <= 9 ? az : 0; pend.ez = ez >= 1 && ez <= 9 ? ez : 0;
        pend.out = c[5] || '';
        const role = (players[side][num] || {}).role;
        pend.g = (num === pend.sNum || role === 5) ? 'D' : role === 4 ? '3' : groupOf(pend.az); // middle = 'centrale' wherever she attacks
        if (!pend.sz) pend.sz = '';
      }
    }
    fin();
    // the scoutman's own call table: code, description, run of the middle (start .. end at the net, DataVolley grid row*100+col)
    const calls = section(lines, 'SETTERCALL').map(l => l.split(';')).filter(f => /^K[A-Z0-9]$/.test((f[0] || '').trim())).map(f => {
      const end = (f[7] || '').trim(), run = /^\d{4}$/.test(end) && end !== '0000';
      return { code: f[0].trim(), name: (f[2] || '').trim(), col: run ? +end % 100 : null, run };
    });
    return {
      calls,
      match: { id, file: fileName, date, teams: teams.map(t => t.name), keys: teams.map(t => t.key), n: recs.length },
      rosters: teams.map((t, i) => ({ team: t.key, name: t.name, date, players: players[i], orders: orders[i].map(seq => ({ m: id, seq })) })),
      recs
    };
  }

  // ---------- model ----------
  // destinations: L = front 4, L5 = back row from 5, R = front 2, R1 = back row from 1 (opposite), C = middle, P = pipe, D = setter
  const SIDE = g => g === '4' ? 'L' : g === '5' ? 'L5' : g === '2' ? 'R' : g === '1' ? 'R1' : g === '3' ? 'C' : g === 'P' ? 'P' : g === 'D' ? 'D' : '';
  const GOOD = q => q === '#' || q === '+';
  const POOR = q => q === '!' || q === '-';
  const KEYS = ['L', 'C', 'R', 'P', 'D'];
  function dist(recs, filt, liveId, liveW) {
    const c = { L: 0, C: 0, R: 0, P: 0, D: 0 }; let w = 0, n = 0, nl = 0;
    recs.forEach(r => {
      if (!r.g || !filt(r)) return; const s = SIDE(r.g); if (!s) return;
      const wt = r.m === liveId ? liveW : 1; c[s] += wt; w += wt; n++; if (r.src === 'live') nl++;
    });
    return { c, w, n, nl };
  }
  // shrink a rotation's distribution toward the setter's overall one
  function shrink(d, prior, K) {
    const out = {}; KEYS.forEach(k => out[k] = (d.c[k] + K * prior[k]) / (d.w + K)); return out;
  }
  function analyze(recs, setterKey, rot, S, liveId) {
    const mine = recs.filter(r => r.setter === setterKey);
    const all = dist(mine, r => GOOD(r.q), liveId, S.liveW);
    const flat = {}; KEYS.forEach(k => flat[k] = 1 / KEYS.length);
    const prior = shrink(all, flat, 2);
    const good = dist(mine, r => r.rot === rot && GOOD(r.q), liveId, S.liveW);
    const poor = dist(mine, r => r.rot === rot && POOR(r.q), liveId, S.liveW);
    const gp = shrink(good, prior, 6), pp = shrink(poor, prior, 6);
    let sig = 'read', why = 'balanced';
    if (good.n < S.minN) why = 'few';
    else if (gp.L * 100 >= S.sideMin && (gp.L - gp.R) * 100 >= S.lead) { sig = '4'; why = 'side'; }
    else if (gp.R * 100 >= S.sideMin && (gp.R - gp.L) * 100 >= S.lead) { sig = '2'; why = 'side'; }
    else if (gp.C * 100 >= S.midMin) { sig = 'fist'; why = 'mid'; }
    // calls and attackers with good reception
    const calls = {}, who = { L: {}, C: {}, R: {}, P: {}, D: {} };
    mine.forEach(r => {
      if (r.rot !== rot || !GOOD(r.q)) return;
      if (r.call) calls[r.call] = (calls[r.call] || 0) + 1;
      const s = SIDE(r.g); if (s && r.att >= 0) who[s][r.att] = (who[s][r.att] || 0) + 1;
    });
    const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
    return { sig, why, good, poor, gp, pp, calls: top(calls), who: Object.fromEntries(KEYS.map(k => [k, top(who[k])])) };
  }
  function setters(recs) {
    const o = {};
    recs.forEach(r => {
      const s = o[r.setter] = o[r.setter] || { key: r.setter, name: r.sName, nums: {}, teams: {}, matches: new Set(), n: 0 };
      s.n++; s.matches.add(r.m); s.teams[r.team] = 1; s.nums[r.sNum] = 1;
    });
    return Object.values(o).map(s => ({ ...s, matches: s.matches.size, teams: Object.keys(s.teams), nums: Object.keys(s.nums) })).sort((a, b) => b.n - a.n);
  }
  return { parseDVW, analyze, setters, nextRot, normName, setterKey, CALLS, callZone, groupOf, SIDE, GOOD, POOR };
})();

  const head = (first, extra = '') => `<thead><tr><th>${first}</th>${extra}<th class="n">${t('n')}</th><th></th>${['R', 'R1', 'C', 'P', 'L'].map(k => `<th class="n">${t('s' + k)}</th>`).join('')}</tr></thead>`;
  // reading the middle
  const rr = S().repRot || 'all', rl = S().repLane || 'all';
  const inScope = r => QF(r.q) && (rr === 'all' || r.rot === +rr) && (rl === 'all' || laneOf(r.rz) === rl);
  const fq = {}; mine.forEach(r => { if (inScope(r) && r.call) fq[r.call] = (fq[r.call] || 0) + 1; });
  const calls = Object.entries(fq).filter(([, n]) => n >= (rr === 'all' && rl === 'all' ? 3 : 1)).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const readRows = calls.map(c => row(`<b>${c}</b> <small class="muted">${esc((CALL_NAMES[c] || [c, c])[li])}</small>`, mine.filter(r => inScope(r) && r.call === c))).join('')
    + row(`<b>⤴</b> <small class="muted">${t('fs')}</small>`, mine.filter(r => inScope(r) && (r.sz === 'FS' || r.call === 'KO')));
  const laneRows = calls.slice(0, 4).map(c => LANES.map(l => row(`<b>${c}</b>`, mine.filter(r => QF(r.q) && r.call === c && laneOf(r.rz) === l), `<td><i class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${laneVar(l)};margin-right:4px"></i>${t('lane' + l.toUpperCase())}</td>`)).join('')).join('');
  let cards = '';
  for (const r of [1, 6, 5, 4, 3, 2]) {
    const g = mine.filter(x => x.rot === r && QF(x.q)), p = mine.filter(x => x.rot === r && x.q === '-');
    const gc = counts(g), pc = counts(p); const gd = {}, pd = {}; KEYS.forEach(k => { gd[k] = gc.n ? gc.c[k] / gc.n : 0; pd[k] = pc.n ? pc.c[k] / pc.n : 0; });
    const sigs = LANES.map(l => { const s = laneSignal(key, '__none__', r, l, QF), w = s.warn; return `<div style="border-left-color:${laneVar(l)}"><div class="msh"><span class="g ${w ? 'warn sig-' + w : 'sig-' + s.sig}">${SIGTXT(w || s.sig)}</span><span class="nm ${w ? 'warnh' : ''}">${w ? t('weak') + ': ' + SIGNAME(w).toLowerCase() : SIGNAME(s.sig)}</span></div><div class="zl">${ZL[l]} <span class="muted">(${s.nh})</span></div>${covRows(s.cov)}</div>`; }).join('');
    const cf = {}; g.forEach(x => { if (x.call) cf[x.call] = (cf[x.call] || 0) + 1; });
    const who = { L: {}, C: {}, R: {}, R1: {} }; g.forEach(x => { const s = SIDE(x.g); const s2 = s === 'L5' ? 'L' : s; if (who[s2]) who[s2][x.att] = (who[s2][x.att] || 0) + 1; });
    const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, c]) => `#${n}<small class="muted">·${c}</small>`).join(' ') || '—';
    cards += `<article class="card rcard"><div class="hd"><b>P${r}</b><span class="badge">${gc.n} ${t('cases')} · ${t('q_' + qk)}</span></div>
      <div class="minisig">${sigs}</div>
      <div class="barlbl"><span>${t('recWord')} ${t('q_' + qk)}</span><span>${gc.n}</span></div>${barHTML(gd)}
      <div class="legend" style="margin-top:3px">${['R', 'R1', 'C', 'P', 'L'].map(k => `<span><i class="k-${k}"></i>${pct(gd[k])}</span>`).join('')}</div>
      ${qk === 'neg' ? '' : `<div class="barlbl"><span>${t('negRec')}</span><span>${pc.n}</span></div>${barHTML(pd)}`}
      <div class="barlbl"><span>${t('callsBy')}</span><button class="linkbtn" data-goread="${r}">${t('detail')} →</button></div>
      <div class="ctab">${Object.entries(cf).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([c, n]) => { const cn = counts(g.filter(x => x.call === c)); const d = {}; KEYS.forEach(k => d[k] = cn.n ? cn.c[k] / cn.n : 0); const mx = KEYS.reduce((a, k) => d[k] > d[a] ? k : a, 'L');
        return `<div class="crow"><b>${c}</b><span class="n">${n}</span>${barHTML(d)}<span class="dm"><i class="k-${mx}"></i>${SHORT[mx]} ${pct(d[mx])}</span></div>`; }).join('') || '<span class="muted">—</span>'}</div>
      <dl class="kv"><dt>${t('sL')}</dt><dd>${top(who.L)}</dd><dt>${t('sC')}</dt><dd>${top(who.C)}</dd><dt>${t('sR')}</dt><dd>${top(who.R)}</dd><dt>${t('sR1')}</dt><dd>${top(who.R1)}</dd></dl></article>`;
  }
  $('#v-study').innerHTML = `<div class="rep">
    <div class="rephead">
      <div class="sbox"><label class="lbl big" for="repSel">${t('pickSetter')}</label>
        <div class="sname">${esc(info.name || '—')} ${info.nums ? `<small>#${info.nums.join('/#')}</small>` : ''}</div>
        <div class="steam">${esc((info.teams || []).join(', '))}${info.matches ? ` · ${info.matches} ${t('matchesN')}` : ''}</div>
      </div>
      <div class="repside"><h2 class="h" style="margin:0">${t('repT')}</h2><p class="muted" style="margin:2px 0 0;max-width:60ch;font-size:14px">${t('repH')}</p>
        <label class="lbl" for="repSel" style="margin-top:8px">${t('changeSetter')}</label>
        <select id="repSel">${list.map(s => `<option value="${esc(s.key)}" ${s.key === key ? 'selected' : ''}>${esc(s.name)} — ${esc(s.teams.join(', '))} (${s.matches})</option>`).join('')}</select>
        <button class="btn pri noprint" data-act="print" style="margin-top:8px">⎙ ${t('printPdf')}</button></div>
    </div>
    <div class="printonly">${t('recType')}: <b>${t('q_' + qk)}</b> · ${t('readT')}: <b>${rr === 'all' ? t('allW') : 'P' + rr}</b> / <b>${rl === 'all' ? t('allW') : ZL[rl]}</b> · ${t('printed')} ${new Date().toLocaleDateString(S().lang === 'it' ? 'it-IT' : 'en-GB')} · Setter Radar</div>
    <div class="qsel qbig" role="group" aria-label="${t('recType')}"><span class="lbl big">${t('recType')}</span>${Object.keys(QFILT).map(k => `<button class="chip" data-repq="${k}" aria-pressed="${k === qk}">${t('q_' + k)}</button>`).join('')}</div>
    <div class="legend" style="margin-top:8px">${VIEW.map(k => `<span><i class="k-${k}"></i>${t('s' + k)}</span>`).join('')}<span>· ${t('rule')}: ${t('ruleTxt').replace('{c}', S().covMin).replace('{l}', S().lead)} · ≥ ${S().minN} ${t('cases')} ${t('hist')} / ≥ ${S().minLive} ${t('live')}</span></div>
    <h3>${t('effT')}</h3><p class="muted" style="margin:-4px 0 6px;font-size:13px">${t('recWord')} ${t('q_' + qk)}. ${t('effH')}</p>
    <div class="card"><div class="row" style="gap:18px">${(() => { const E = effMap(key, QF); return VIEW.map(k => `<span><i class="k-${k}" style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px"></i>${t('s' + k)} <b class="disp" style="font-size:20px">${E['r' + k] == null ? '—' : Math.round(E['r' + k] * 100) + '%'}</b> <small class="muted">n${E['n' + k]}${E['n' + k] && E['n' + k] < 10 ? ' · ' + t('fewW') : ''}</small></span>`).join(''); })()}</div></div>
    <h3 id="readT">${t('readT')}</h3><p class="muted" style="margin:-4px 0 6px;font-size:13px">${t('recWord')} ${t('q_' + qk)}. ${t('readH')}</p>
    <div class="qsel" style="margin:0 0 6px"><span class="lbl">${t('rotWord')}</span>${['all', 1, 6, 5, 4, 3, 2].map(k => `<button class="chip" data-reprot="${k}" aria-pressed="${String(k) === String(rr)}">${k === 'all' ? t('allW') : 'P' + k}</button>`).join('')}</div>
    <div class="qsel" style="margin:0 0 8px"><span class="lbl">${t('zoneWord')}</span>${['all', 'a', 'b', 'c'].map(k => `<button class="chip" data-replane="${k}" aria-pressed="${k === rl}">${k === 'all' ? t('allW') : `<i class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${laneVar(k)};margin-right:5px"></i>` + ZL[k]}</button>`).join('')}</div>
    <div class="card tbl"><table>${head(t('call'))}<tbody>${readRows}</tbody></table></div>
    <div class="rothead"><h3>${t('rotT')}</h3><div class="biglegend">${VIEW.map(k => `<span><i class="k-${k}"></i>${t('s' + k)}</span>`).join('')}</div></div>
    <div class="rgrid">${cards}</div>${summaryHTML(key, info, mine, QF, qk)}</div>`;
}

// ===================== summary (rule-based, thresholds from Settings) =====================
function summaryHTML(key, info, mine, QF, qk) {
  const st = S(), thr = st.covMin / 100, minN = st.minN;
  const dname = k => t('s' + k).toLowerCase();
  const distOf = arr => { const cn = counts(arr); const d = {}; KEYS.forEach(k => d[k] = cn.n ? cn.c[k] / cn.n : 0); const top = KEYS.reduce((a, k) => d[k] > d[a] ? k : a, 'L'); return { d, n: cn.n, top, share: d[top] }; };
  const f = mine.filter(r => QF(r.q));
  const all = distOf(f);
  // 1. identikit
  const att = {}; f.forEach(r => { if (r.att < 0) return; const o = att[r.att] = att[r.att] || { n: 0, v: 0, s: {} }; o.n++; if (r.out === '#') o.v++; else if (r.out === '=' || r.out === '/') o.v--; const k = SIDE(r.g); o.s[k] = (o.s[k] || 0) + 1; });
  const mainSide = o => { const k = Object.entries(o.s).sort((a, b) => b[1] - a[1])[0]; return k ? dname(k[0]) : ''; };
  const most = Object.entries(att).sort((a, b) => b[1].n - a[1].n)[0];
  const eff = Object.entries(att).filter(([, o]) => o.n >= 10).sort((a, b) => b[1].v / b[1].n - a[1].v / a[1].n)[0];
  const distTxt = VIEW.filter(k => all.d[k] >= .05).sort((a, b) => all.d[b] - all.d[a]).map(k => `${dname(k)} ${pct(all.d[k])}`).join(', ');
  const b1 = `<p>${t('sumId1').replace('{m}', info.matches || 0).replace('{n}', all.n).replace('{q}', t('q_' + qk))}: ${distTxt || '—'}.</p>
    <p>${most ? t('sumMost').replace('{p}', '#' + most[0]).replace('{s}', mainSide(most[1])).replace('{n}', most[1].n) : ''}${eff ? ' ' + t('sumEff').replace('{p}', '#' + eff[0]).replace('{s}', mainSide(eff[1])).replace('{e}', Math.round(eff[1].v / eff[1].n * 100) + '%').replace('{n}', eff[1].n) : ''}</p>`;
  // 2. strongest tendencies
  const items = [];
  [...new Set(f.map(r => r.call).filter(Boolean))].forEach(c => { const x = distOf(f.filter(r => r.call === c)); if (x.n >= minN && x.share >= thr) items.push({ v: x.share, n: x.n, txt: `<b>${c}</b> → ${dname(x.top)} <b>${pct(x.share)}</b> <span class="muted">(${x.n} ${t('cases')})</span>` }); });
  [1, 6, 5, 4, 3, 2].forEach(r => LANES.forEach(l => { const s = laneSignal(key, '__none__', r, l, QF); if (s.sig !== 'read') items.push({ v: s.cov[s.sig], n: s.nh, txt: `<b>P${r}</b> ${t('from')} <b>${ZL[l]}</b> → ${SIGNAME(s.sig).toLowerCase()} <span class="muted">(${t('covers')} ${pct(s.cov[s.sig])}, ${s.nh} ${t('cases')})</span>` }); }));
  ['#', '+', '!', '-'].forEach(q => { const x = distOf(mine.filter(r => r.q === q)); if (x.n >= minN && x.share >= thr) items.push({ v: x.share, n: x.n, txt: `${t('withRec')} <b>${q === '-' ? '−' : q}</b> → ${dname(x.top)} <b>${pct(x.share)}</b> <span class="muted">(${x.n} ${t('cases')})</span>` }); });
  items.sort((a, b) => b.v - a.v || b.n - a.n);
  const b2 = items.length ? `<ol>${items.slice(0, 5).map(i => `<li>${i.txt}</li>`).join('')}</ol>` : `<p class="muted">${t('sumNone').replace('{p}', st.covMin)}</p>`;
  // 3. serve plan per rotation
  const b3 = `<table class="plan"><tbody>${[1, 6, 5, 4, 3, 2].map(r => {
    const sg = LANES.map(l => ({ l, s: laneSignal(key, '__none__', r, l, QF) }));
    const strong = sg.filter(x => x.s.sig !== 'read').sort((a, b) => b.s.cov[b.s.sig] - a.s.cov[a.s.sig])[0];
    let plan;
    if (strong) plan = `${t('serveIn')} <b>${ZL[strong.l]}</b> → <span class="sig-${strong.s.sig}" style="color:#fff;font-weight:700;font-size:13px;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em">${SIGNAME(strong.s.sig)}</span> <span class="muted">(${pct(strong.s.cov[strong.s.sig])})</span>`;
    else { const best = sg.map(x => { const k = ['fist', '4', '2'].reduce((a, q) => x.s.cov[q] > x.s.cov[a] ? q : a, 'fist'); return { l: x.l, k, v: x.s.cov[k] }; }).sort((a, b) => b.v - a.v)[0]; plan = `<span class="muted">${t('noClear')}: ${ZL[best.l]} → ${SIGNAME(best.k).toLowerCase()} ${pct(best.v)}</span>`; }
    const rr = f.filter(x => x.rot === r);
    const key2 = [...new Set(rr.map(x => x.call).filter(Boolean))].map(c => ({ c, x: distOf(rr.filter(x => x.call === c)) })).filter(o => o.x.n >= 4).sort((a, b) => b.x.share * Math.min(1, b.x.n / 8) - a.x.share * Math.min(1, a.x.n / 8) || b.x.n - a.x.n)[0];
    return `<tr><td><b>P${r}</b></td><td>${plan}</td><td>${key2 ? `${t('watch')} <b>${key2.c}</b>: ${dname(key2.x.top)} ${pct(key2.x.share)} <span class="muted">(${key2.x.n})</span>` : '—'}</td></tr>`;
  }).join('')}</tbody></table>`;
  // 4. out of system
  const line = (lab, arr) => { const x = distOf(arr); if (!x.n) return ''; const two = VIEW.filter(k => x.d[k] > 0).sort((a, b) => x.d[b] - x.d[a]).slice(0, 2).map(k => `${dname(k)} ${pct(x.d[k])}`).join(', '); return `<li>${lab}: ${two} <span class="muted">(${x.n} ${t('cases')})</span></li>`; };
  const hb = {}; mine.filter(r => (r.sz === 'FS' || r.call === 'KO') && r.att >= 0).forEach(r => hb[r.att] = (hb[r.att] || 0) + 1);
  const hbTop = Object.entries(hb).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([p, n]) => `#${p} (${n})`).join(', ');
  const b4 = `<ul>${line(t('withRec') + ' !', mine.filter(r => r.q === '!'))}${line(t('withRec') + ' −', mine.filter(r => r.q === '-'))}${line(t('fs'), mine.filter(r => r.sz === 'FS' || r.call === 'KO'))}${hbTop ? `<li>${t('highBalls')}: ${hbTop}</li>` : ''}</ul>`;
  // 5. reliability
  const per = [1, 6, 5, 4, 3, 2].map(r => ({ r, n: f.filter(x => x.rot === r).length }));
  const minRot = Math.min(...per.map(x => x.n)), m = info.matches || 0;
  const lvl = m >= 6 && minRot >= 20 ? 'high' : m >= 3 && minRot >= 10 ? 'mid' : 'low';
  const weak = per.filter(x => x.n < 15).map(x => 'P' + x.r);
  const b5 = `<p><span class="rel rel-${lvl}">${t('rel_' + lvl)}</span> ${t('sumRel').replace('{m}', m).replace('{min}', minRot)}${weak.length ? ' ' + t('sumWeak').replace('{r}', weak.join(', ')) : ''}</p>
    <p class="muted" style="font-size:12px">${t('sumRule').replace('{c}', st.covMin).replace('{l}', st.lead).replace('{n}', minN)}</p>`;
  return `<section class="summary card">
    <h3>${t('sumT')} — ${esc(info.name || '')}</h3>
    <div class="sgrid">
      <div><h4>1 · ${t('sum1')}</h4>${b1}</div>
      <div><h4>2 · ${t('sum2')}</h4>${b2}</div>
      <div class="wide"><h4>3 · ${t('sum3')}</h4>${b3}</div>
      <div><h4>4 · ${t('sum4')}</h4>${b4}</div>
      <div><h4>5 · ${t('sum5')}</h4>${b5}</div>
    </div></section>`;
}

    wipe() { if (UI.delConfirm !== '__wipe') { UI.delConfirm = '__wipe'; render(); return; } DB = { v: 2, matches: [], recs: [], rosters: {}, settings: DB.settings, live: null }; UI.delConfirm = null; UNDO = []; save(); render(); toast(t('done')); }
  };
  if (d.act && acts[d.act]) acts[d.act]();

function doSub(n) {
  const lv = L(), sb = UI.sub, done = sb.done || [];
  if (!done.length) snapshot();
  const i = lv.lineup.indexOf(sb.out); if (i >= 0) lv.lineup[i] = n;
  if (!lv.roster[n]) lv.roster[n] = { last: '', role: 0 };
  (lv.subs = lv.subs || []).push({ set: lv.set, score: lv.score.slice(), out: sb.out, in: n });
  const pairs = [...done, { out: sb.out, in: n }];
  if (sb.double && pairs.length < 2) { UI.sub = { out: null, double: true, done: pairs }; save(); render(); return; }
  // did the setter change? an incoming setter, or the setter on court went out
  const inSetter = pairs.map(p => p.in).find(x => (lv.roster[x] || {}).role === 5 && x !== lv.sNum);
  const outSetter = pairs.some(p => p.out === lv.sNum);
  if (inSetter != null || outSetter) { UI.sub = { ask: inSetter != null ? inSetter : (pairs.find(p => p.out === lv.sNum) || {}).in }; save(); render(); return; }
  UI.sub = null; save(); render();
}
function setActiveSetter(n) {
  const lv = L(), p = lv.roster[n] = lv.roster[n] || { last: '', role: 0 };
  const name = (p.last || '').trim() || lv.teamName;
  p.role = 5; lv.sNum = n; lv.sName = name.toUpperCase(); lv.setter = SR.setterKey(name, n);
  const i = lv.lineup.indexOf(n); if (i >= 0) lv.rot = i + 1;
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'repSel') { UI.repSetter = el.value; render(); }
  if (el.id === 'dvwIn' && el.files.length) importDVWFiles(el.files);
  if (el.id === 'sqIn' && el.files.length) importSQFiles(el.files);
  if (el.dataset && el.dataset.ce) callEdit(el.dataset.ce, el.dataset.cf, el.value);
  if (el.id === 'jsonIn' && el.files[0]) { const fr = new FileReader(); fr.onload = () => restore(fr.result); fr.readAsText(el.files[0]); }
  if (el.id === 'myTeam') { S().myTeam = el.value.trim(); save(); }
  if (el.dataset.set) { const v = parseFloat(el.value); if (!isNaN(v)) { S()[el.dataset.set] = v; save(); } }
  if (el.id === 'set-one') { S().oneCourt = el.value === '1'; save(); }
  if (el.id === 'set-rori') { S().rOri = +el.value; save(); }
  if (el.id === 'set-sigq') { S().sigExcl = el.value === '1'; save(); }
  if (el.id === 'set-theme') { S().theme = el.value || undefined; if (el.value) document.documentElement.dataset.theme = el.value; else delete document.documentElement.dataset.theme; save(); }
});
// live screen must fit the tablet without scrolling: size it to the real visible height
function fit() { const h = $('header.top'); document.documentElement.style.setProperty('--avail', Math.max(480, window.innerHeight - (h ? h.offsetHeight : 48) - 14) + 'px'); }
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 200)); document.addEventListener('fullscreenchange', fit);
let wl = null;
function wake() { try { if (navigator.wakeLock && !wl) navigator.wakeLock.request('screen').then(w => { wl = w; w.addEventListener('release', () => wl = null); }).catch(() => {}); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && L() && L().started) wake(); });
