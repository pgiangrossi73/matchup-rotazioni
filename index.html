<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3fd4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%}</style>
<title>Matchup Rotazioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra squadre fissa in alto, tre schede (Panchina per il telefono, Studio per il laptop, Dati); colori MySportee viola/arancio */
:root {
  --bg: #f4f3f8; --surface: #ffffff; --sunk: #ebe9f2; --ink: #1d1a2e; --muted: #67627d; --line: #dedbe8;
  --accent: #5a3fd4; --accent-ink: #ffffff; --hot: #e9661c; --good: #17905f; --bad: #cf3f3f;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12101b; --surface: #1b1828; --sunk: #242036; --ink: #eeebf8; --muted: #9d97b4; --line: #302b45;
  --accent: #9b86ff; --accent-ink: #14111f; --hot: #ff8b45; --good: #3cc58c; --bad: #f06d6d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12101b; --surface: #1b1828; --sunk: #242036; --ink: #eeebf8; --muted: #9d97b4; --line: #302b45;
  --accent: #9b86ff; --accent-ink: #14111f; --hot: #ff8b45; --good: #3cc58c; --bad: #f06d6d; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, select:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .01em; text-transform: uppercase; line-height: 1 }
.brand b { color: var(--hot) }
.teams { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1 1 340px }
.teams label { display: flex; flex-direction: column; gap: 2px; flex: 1 1 140px; min-width: 0 }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
select { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 600 }
.vs { font-family: var(--f-display); font-weight: 700; color: var(--muted); padding-top: 14px }
nav.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 9px }
nav.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; font-weight: 600; color: var(--muted) }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }

main { padding-block: 18px 40px; display: grid; gap: 18px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0 }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 10px; text-wrap: balance }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; font-weight: 600 }
p { margin: 0 }
.note { color: var(--muted); font-size: 13px; max-width: 70ch }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)) }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

/* controlli a chip */
.field { display: grid; gap: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 0; min-width: 46px; font-weight: 600; text-align: center }
.chip.wide { padding: 8px 14px }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.chip.ghost[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff }
.bench-form { display: grid; gap: 14px }
.row { display: flex; gap: 18px; flex-wrap: wrap }
.row > .field { flex: 1 1 200px }
.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink) }
.btn.sec { background: var(--sunk); color: var(--ink) }
.btn.small { padding: 6px 10px; font-size: 13px }

/* risultato panchina */
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; padding: 14px 16px; border-radius: var(--r); background: var(--sunk) }
.verdict .big { font-family: var(--f-display); font-weight: 700; font-size: 64px; line-height: .9; color: var(--hot); grid-row: span 2 }
.verdict .k { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-transform: uppercase }
.verdict .s { color: var(--muted); font-size: 13px }
.bars { display: grid; gap: 5px }
.bar { display: grid; grid-template-columns: 34px 1fr 52px; gap: 8px; align-items: center; font-size: 14px }
.bar .t { height: 20px; background: var(--sunk); border-radius: 4px; overflow: hidden; position: relative }
.bar .t i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px }
.bar.best .t i { background: var(--hot) }
.bar .t .mid { position: absolute; top: -2px; bottom: -2px; left: 50%; border-left: 1px dashed var(--muted); opacity: .6 }
.bar b { font-family: var(--f-display); font-size: 18px }
.bar .v { text-align: right }
.log { display: grid; gap: 4px; font-size: 13px }
.log div { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 8px; background: var(--bg); border-radius: 6px }
.endset { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 12px }

/* tabelle */
.tbl-wrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600 }
td.r, th.r { text-align: right }
.pct { display: inline-flex; align-items: center; gap: 6px }
.pct s { text-decoration: none; display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); opacity: .75 }
.n { color: var(--muted); font-size: 12px }
.tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--sunk) }
.tag.w { background: color-mix(in oklab, var(--good) 18%, var(--surface)); color: var(--good) }
.tag.l { background: color-mix(in oklab, var(--bad) 16%, var(--surface)); color: var(--bad) }
.hi { color: var(--good); font-weight: 600 } .lo { color: var(--bad); font-weight: 600 }

/* heatmap */
.heat { display: grid; grid-template-columns: 54px repeat(6, minmax(40px, 1fr)); gap: 3px; min-width: 330px }
.heat .h { font-size: 11px; color: var(--muted); text-align: center; align-self: end; padding-bottom: 2px; font-weight: 600 }
.heat .rh { font-family: var(--f-display); font-weight: 700; font-size: 17px; align-self: center }
.heat button { border: 0; border-radius: 5px; padding: 10px 0; font-family: var(--f-mono); font-size: 14px; color: var(--ink) }
.heat button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px }
.legend { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap }
.legend i { width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in oklab, var(--bad) 70%, var(--surface)), var(--sunk), color-mix(in oklab, var(--good) 70%, var(--surface))) }
.phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 10px }
.ph { padding: 7px 9px; background: var(--bg); border-radius: 6px; font-size: 13px; display: grid; gap: 2px }
.ph b { font-family: var(--f-display); font-size: 16px }

.findings { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.findings li { padding: 10px 12px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--accent) }
.findings li.strong { border-left-color: var(--hot) }
.findings b { font-weight: 600 }

.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; display: grid; gap: 8px; justify-items: center }
.drop.over { border-color: var(--accent); background: var(--sunk) }
.matches { display: grid; gap: 6px }
.match { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--bg); border-radius: 8px; flex-wrap: wrap }
.match .t { flex: 1 1 220px; min-width: 0 }
.warn { padding: 10px 12px; border-radius: 8px; background: color-mix(in oklab, var(--hot) 14%, var(--surface)); font-size: 13px }
.empty { color: var(--muted); padding: 10px 0 }
/* rete */
.nets { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); margin-top: 10px }
.phn { background: var(--bg); border-radius: 8px; padding: 10px; display: grid; gap: 8px; min-width: 0 }
.phh { display: flex; justify-content: space-between; gap: 8px; font-size: 14px }
.phh b { font-family: var(--f-display); font-size: 17px; font-weight: 700 }
.net { display: grid; gap: 4px }
.netrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px }
.netline { position: relative; height: 10px }
.netline::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dotted var(--muted) }
.netline span { position: absolute; left: 50%; transform: translate(-50%, -2px); background: var(--bg); padding: 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
.pl { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 6px; padding: 5px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); min-width: 0; font-size: 12.5px; line-height: 1.25 }
.pl.us { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)) }
.pl.them { border-color: color-mix(in oklab, var(--hot) 45%, var(--line)) }
.pl.set { opacity: .7 }
.pl .rl { grid-row: span 2; align-self: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk) }
.pl.us .rl { color: var(--accent) } .pl.them .rl { color: var(--hot) }
.pl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pl .ef { font-size: 12px }
.netfoot { display: grid; gap: 2px; font-size: 12px; color: var(--muted); margin-top: 4px }
.netfoot b { color: var(--ink) }
details.panel > summary { cursor: pointer; list-style-position: outside; margin-left: 18px }
/* piano di battuta */
.plan { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)) }
.pc { background: var(--bg); border-radius: 8px; padding: 12px; display: grid; gap: 8px; min-width: 0; align-content: start }
.pch { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.pch b { font-family: var(--f-display); font-size: 18px; font-weight: 700; text-transform: uppercase }
.srv { font-size: 14px }
.pcb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start }
.tg-list { display: grid; gap: 6px; font-size: 14px; min-width: 0 }
.risk { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em }
.risk.push { background: var(--hot); color: #fff }
.risk.safe { background: color-mix(in oklab, var(--good) 22%, var(--surface)); color: var(--good) }
.risk.aim { background: var(--sunk); color: var(--ink) }
.court { display: grid; grid-template-columns: repeat(3, 34px); gap: 2px; position: relative; padding-bottom: 14px }
.cz { height: 34px; border-radius: 4px; display: grid; place-items: center; align-content: center; font-size: 10px; line-height: 1.1 }
.cz b { font-size: 12px } .cz i { font-style: normal; font-size: 9.5px }
.cz.tg { outline: 2px solid var(--ink); outline-offset: -2px }
.cnet { position: absolute; left: 0; right: 0; bottom: 0; border-top: 2px dotted var(--muted); font-size: 9px; text-align: center; color: var(--muted); text-transform: uppercase; letter-spacing: .1em }
/* alzata */
.setl { font-size: 13px }
.setgrid { display: grid; gap: 18px; grid-template-columns: auto minmax(0, 400px) minmax(0, 1fr); align-items: start }
.landpick { display: grid; gap: 8px; justify-items: start; max-width: 200px }
.court.big { grid-template-columns: repeat(3, 56px) }
.court.big .cz { height: 50px; border: 1px solid var(--line); background: var(--bg); color: var(--ink) }
.court.big .cz b { font-size: 15px } .court.big .cz i { font-size: 10px; color: var(--muted) }
.court.big .cz[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.court.big .cz[aria-pressed="true"] i { color: inherit }
@media (max-width: 900px) { .setgrid { grid-template-columns: minmax(0, 1fr) } .landpick { max-width: none } }
.setcourt { display: grid; gap: 4px }
.szrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px }
.sz { border-radius: 8px; padding: 8px; display: grid; gap: 1px; min-height: 92px; align-content: start; background: color-mix(in oklab, var(--hot) var(--a), var(--sunk)); min-width: 0 }
.sz.top { outline: 2px solid var(--hot); outline-offset: -2px }
.sz b { font-family: var(--f-display); font-size: 26px; line-height: 1 }
.szl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.szw { font-size: 12.5px; overflow-wrap: anywhere }
.setinfo { display: grid; gap: 8px; font-size: 14px }
.jump { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin }
.jump .chip { white-space: nowrap; flex: none }
[id^="st-"], details.panel { scroll-margin-top: 170px }
.lang { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 6px 4px }
@media (max-width: 520px) { .verdict .big { font-size: 52px } .brand { font-size: 21px } nav.tabs { width: 100% } nav.tabs button { flex: 1 } }
@media (prefers-reduced-motion: no-preference) { .bar .t i { transition: width .25s ease } }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Matchup <b>Rotazioni</b></div>
    <div class="teams">
      <label for="selMy"><span class="lbl">Noi</span><select id="selMy"></select></label>
      <span class="vs">VS</span>
      <label for="selOpp"><span class="lbl">Avversario</span><select id="selOpp"></select></label>
    </div>
    <a class="lang" href="en.html" hreflang="en">English</a>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-bench" aria-selected="true" data-tab="bench">Panchina</button>
      <button role="tab" id="tab-study" aria-selected="false" data-tab="study">Studio</button>
      <button role="tab" id="tab-data" aria-selected="false" data-tab="data">Dati</button>
    </nav>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>

<script>
// ===== Rotazioni: core (parser .dvw + statistiche + simulazione + previsione) =====
const RC = (() => {
  const nextRot = r => (r === 1 ? 6 : r - 1); // ordine DataVolley: P1 -> P6 -> P5 ...

  function normName(s) {
    return (s || '').toUpperCase().replace(/\(.*?\)/g, ' ').replace(/[^A-Z0-9 ]/g, ' ')
      .replace(/\b(VC|V C|WOMEN|W|FC|BC)\b/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function section(lines, name) {
    const i = lines.findIndex(l => l.trim().toUpperCase() === '[3' + name + ']');
    if (i < 0) return [];
    const out = [];
    for (let j = i + 1; j < lines.length && !/^\[3/.test(lines[j]); j++) out.push(lines[j]);
    return out;
  }

  function parseDVW(text, fileName) {
    const lines = text.replace(/\r/g, '').split('\n');
    const match = section(lines, 'MATCH');
    const teamsL = section(lines, 'TEAMS').filter(l => l.trim());
    if (teamsL.length < 2) throw new Error('Sezione squadre non trovata');
    const mf = (match[0] || '').split(';');
    const tf = teamsL.map(l => l.split(';'));
    const teams = [0, 1].map(i => ({
      code: (tf[i][0] || '').trim(), name: (tf[i][1] || '').trim(),
      coach: (tf[i][3] || '').trim(), key: normName(tf[i][1])
    }));
    // giocatrici: ruolo DataVolley 1 libero, 2 schiacciatrice, 3 opposto, 4 centrale, 5 palleggiatrice
    const players = [section(lines, 'PLAYERS-H'), section(lines, 'PLAYERS-V')].map(arr => {
      const out = {};
      arr.forEach(l => {
        const f = l.split(';'); if (f.length < 14 || f[1] === '' || isNaN(+f[1])) return;
        const last = (f[9] || '').trim(), first = (f[10] || '').trim();
        out[+f[1]] = { last, first, role: (f[12] || '').trim() === 'L' ? 1 : (+f[13] || 0) };
      });
      return out;
    });
    const pstats = [{}, {}];
    const ps = (side, n) => (pstats[side][n] = pstats[side][n] || { aN: 0, aK: 0, aE: 0, aB: 0, sN: 0, sA: 0, sE: 0, bK: 0, rN: 0, rG: 0, rE: 0 });
    const lineups = [{}, {}]; // lineups[side][rot]["z1,z2,...,z6"] = rally

    const scout = section(lines, 'SCOUT');
    const sets = {};
    let lastWinner = null, curSet = 0, pendingServer = null, setter = [null, null], srv = null, rec = null, waitAtt = -1, att = null;
    const getSet = n => (sets[n] = sets[n] || { n, rallies: [], start: null, firstServe: null, lineup: null, setters: [null, null] });

    for (const raw of scout) {
      if (!raw.trim()) continue;
      const f = raw.split(';');
      const code = f[0];
      const setN = parseInt(f[8], 10);
      if (/^\*\*\dset/i.test(code)) { lastWinner = null; pendingServer = null; continue; }
      const side = code[0] === '*' ? 0 : code[0] === 'a' ? 1 : -1;
      if (side < 0) continue;
      const pm = code.match(/^[*a]P(\d+)/);
      if (pm) { setter[side] = +pm[1]; continue; }
      if (!setN) continue;
      if (setN !== curSet) { curSet = setN; lastWinner = null; pendingServer = null; }
      const s = getSet(setN);
      if (!s.setters[side] && setter[side] != null) s.setters[side] = setter[side];
      const rz = [parseInt(f[9], 10), parseInt(f[10], 10)];
      const sk = code.match(/^[*a](\d\d)([SREABDF])[A-Z~]?([#+!\-\/=])?/);
      if (sk) {
        const st = ps(side, +sk[1]), ev = sk[3];
        if (sk[2] === 'A') { st.aN++; if (ev === '#') st.aK++; else if (ev === '=') st.aE++; else if (ev === '/') st.aB++; }
        else if (sk[2] === 'S') { st.sN++; if (ev === '#') st.sA++; else if (ev === '=') st.sE++; }
        else if (sk[2] === 'B') { if (ev === '#') st.bK++; }
        else if (sk[2] === 'R') { st.rN++; if (ev === '#' || ev === '+') st.rG++; else if (ev === '=') st.rE++; }
      }
      if (waitAtt >= 0 && /^[*a](\d\d|\$\$)[A-Z]/.test(code) && !/^[*a]\d\dR/.test(code)) {
        if (side !== waitAtt) waitAtt = -1;
        else if (code[3] === 'A') {
          const fz = parseInt(code[9], 10);
          att = { num: +code.slice(1, 3), from: fz >= 1 && fz <= 9 ? fz : 0, ev: code[5] || '', combo: code.slice(6, 8).replace(/~/g, '') };
          waitAtt = -1;
        }
      }
      if (/^[*a]\d\dR/.test(code)) {
        const ez = parseInt(code[10], 10);
        rec = { num: +code.slice(1, 3), ev: code[5] || '', ez: ez >= 1 && ez <= 9 ? ez : 0 };
        waitAtt = side;
        if (srv && !srv.ez) srv.ez = rec.ez;
      }
      if (/^[*a](\d\d|\$\$)S/.test(code)) {
        pendingServer = side;
        { const num = code.slice(1, 3) === '$$' ? -1 : +code.slice(1, 3), ez = parseInt(code[10], 10);
          const sz = parseInt(code[9], 10);
          srv = { num, type: code[4] || '', ev: code[5] || '', ez: ez >= 1 && ez <= 9 ? ez : 0, sz: sz >= 1 && sz <= 9 ? sz : 0 }; rec = null; att = null; waitAtt = -1; }
        if (!s.start && rz[0] >= 1 && rz[0] <= 6 && rz[1] >= 1 && rz[1] <= 6) {

  myKey: saved.myKey, oppKey: saved.oppKey, tab: saved.tab || 'bench',
  bench: Object.assign(freshBench(), saved.bench || {}), studyServe: saved.studyServe ?? 0, sel: null, hist: 'opp', srot: 1, sland: 0, sq: '*'
};
const cache = {};
const invalidate = () => { for (const k in cache) delete cache[k]; };

function teamList() {
  const m = {};
  S.matches.forEach(x => x.teams.forEach(t => {
    m[t.key] = m[t.key] || { key: t.key, name: t.name, coach: '', n: 0 };
    m[t.key].n++; if (t.coach && !m[t.key].coach) m[t.key].coach = t.coach;
  }));
  return Object.values(m).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}
function ensureTeams() {
  const tl = teamList(), keys = tl.map(t => t.key);
  if (!keys.length) { $('#selMy').innerHTML = $('#selOpp').innerHTML = ''; return; }
  if (!keys.includes(S.myKey)) S.myKey = keys.includes('AEL LIMASSOL') ? 'AEL LIMASSOL' : keys[0];
  if (!keys.includes(S.oppKey) || S.oppKey === S.myKey) S.oppKey = keys.find(k => k === 'OLYMPIADA NEAPOLIS' && k !== S.myKey) || keys.find(k => k !== S.myKey);
  const opt = sel => tl.map(t => `<option value="${esc(t.key)}"${t.key === sel ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
  $('#selMy').innerHTML = opt(S.myKey); $('#selOpp').innerHTML = opt(S.oppKey);
}
const teamName = k => (teamList().find(t => t.key === k) || {}).name || k;
const coachOf = k => (teamList().find(t => t.key === k) || {}).coach || '';

function fmtDate(d) {
  const p = (d || '').split(/[\/.-]/); if (p.length < 3) return d || '';
  let [a, b, y] = p.map(Number); let dd = b, mm = a; if (a > 12) { dd = a; mm = b; }
  return `${String(dd).padStart(2, '0')}/${String(mm).padStart(2, '0')}/${String(y).slice(-2)}`;
}

// ---------- modello ----------
function model() {
  const k = S.myKey + '|' + S.oppKey;
  if (cache.k === k && cache.model) return cache.model;
  const L = RC.leagueSO(S.matches);
  const mk = key => {
    const st = RC.rotStats(S.matches, key);
    if (st.so == null) { st.so = L; st.bp = 1 - L; }
    if (st.bp == null) st.bp = 1 - L;
    return { st, est: RC.shrunk(st) };
  };
  const A = mk(S.myKey), B = mk(S.oppKey);
  cache.k = k; cache.mats = {};
  cache.model = { L, A, B };
  return cache.model;
}
function mat(firstServer, target) {
  const m = model(); const key = firstServer + '|' + target;
  if (!cache.mats[key]) cache.mats[key] = RC.matrix(m.A.est, m.B.est, m.L, firstServer, target, 4000);
  return cache.mats[key];
}
function oppRows(withLive) {
  const rows = RC.startHistory(S.matches, S.oppKey);
  if (withLive) S.bench.log.forEach((l, i) => rows.push({
    match: 'live', date: 'oggi', opp: teamName(S.myKey), set: l.set, start: l.oppStart, oppStart: l.myStart,
    serveFirst: l.oppServe, won: l.oppWon, score: ['', '']
  }));
  return rows;
}


// ---------- giocatrici ----------
const ROLE = { 1: ['L', 'Libero'], 2: ['S', 'Schiacciatrice'], 3: ['O', 'Opposto'], 4: ['C', 'Centrale'], 5: ['P', 'Palleggiatrice'] };
function people() {
  const k = 'pp|' + S.myKey + '|' + S.oppKey;
  if (cache.pp && cache.pp.k === k) return cache.pp;
  cache.pp = { k, my: { P: RC.teamPlayers(S.matches, S.myKey), L: RC.teamLineups(S.matches, S.myKey) }, opp: { P: RC.teamPlayers(S.matches, S.oppKey), L: RC.teamLineups(S.matches, S.oppKey) } };
  return cache.pp;
}
function slot(team, num, side) {
  const p = team.P[num] || { num, last: '#' + num, role: 0 };
  const r = ROLE[p.role] || ['?', ''];
  const att = p.role !== 5 && p.role !== 1;
  const effCls = p.eff == null ? '' : p.eff >= 0.25 ? 'hi' : p.eff < 0.12 ? 'lo' : '';
  return `<div class="pl ${side}${att ? '' : ' set'}"><span class="rl" title="${r[1]}">${r[0]}</span><span class="nm"><b class="num">${num}</b> ${esc(p.last)}</span>${att && p.aN ? `<span class="ef num ${effCls}" title="Efficienza in attacco su ${p.aN} attacchi">${Math.round(p.eff * 100)}%</span>` : `<span class="ef n">${p.role === 5 ? 'alzatrice' : ''}</span>`}</div>`;
}
// prima linea dopo i cambi: palleggiatrice/opposto in 2, centrale in 3, schiacciatrice in 4
function frontSwitched(team, zones) {
  const pos = { 4: zones[3], 3: zones[2], 2: zones[1] };
  const want = n => { const r = (team.P[n] || {}).role; return r === 5 || r === 3 ? 2 : r === 4 ? 3 : r === 2 ? 4 : null; };
  const out = {}, left = [];
  [pos[4], pos[3], pos[2]].forEach(n => { const w = want(n); if (w && !out[w]) out[w] = n; else left.push(n); });
  [4, 3, 2].forEach(z => { if (!out[z]) out[z] = left.shift(); });
  return out;
}
function attackers(team, zones) { return [1, 2, 3].filter(i => { const p = team.P[zones[i]]; return !p || (p.role !== 5 && p.role !== 1); }).length; }
// rete: colonne allineate (nostra Z4 contro loro Z2, Z3 contro Z3, nostra Z2 contro loro Z4)
function netView(a, b, sv) {
  const pp = people(), lm = pp.my.L[a], lo = pp.opp.L[b];
  if (!lm || !lo) return '<p class="note">Formazione non disponibile nei file per questa rotazione.</p>';
  const zm = lm.zones, zo = lo.zones;
  const fm = frontSwitched(pp.my, zm), fo = frontSwitched(pp.opp, zo);
  const cols = [[4, 2], [3, 3], [2, 4]]; // zona d'attacco: nostra, loro
  const server = sv === 0 ? pp.my.P[zm[0]] : pp.opp.P[zo[0]];
  const srvNum = sv === 0 ? zm[0] : zo[0];
  return `<div class="net">
    <div class="netrow">${cols.map(([, o]) => slot(pp.opp, fo[o], 'them')).join('')}</div>
    <div class="netline"><span>rete</span></div>
    <div class="netrow">${cols.map(([m]) => slot(pp.my, fm[m], 'us')).join('')}</div>
    <div class="netfoot"><span>Attaccanti in prima linea: <b>${attackers(pp.my, zm)}</b> noi · <b>${attackers(pp.opp, zo)}</b> loro</span><span>Battuta: ${sv === 0 ? 'noi' : 'loro'} #${srvNum} ${esc(server ? server.last : '')}${server && server.sN ? ` (${server.sA} ace, ${server.sE} errori su ${server.sN})` : ''}</span></div>
  </div>`;
}
function phaseNets(a, b, firstServer, M) {
  const m = model();
  const ph = RC.phases(m.A.est, m.B.est, m.L, a, b, firstServer);
  return `<div class="nets">${ph.map((x, i) => `<div class="phn"><div class="phh"><b>${i + 1}. Noi P${x.a} vs loro P${x.b}</b><span class="num ${x.p >= 0.5 ? 'hi' : 'lo'}">${pc(x.p)} rally</span></div>${netView(x.a, x.b, x.sv)}</div>`).join('')}</div>
  <p class="note" style="margin-top:8px">Sequenza del primo giro. Ogni colonna è un incrocio a rete dopo i cambi di posizione (schiacciatrice in 4, centrale in 3, opposto o palleggiatrice in 2): la nostra zona 4 contro la loro zona 2, centro contro centro, la nostra zona 2 contro la loro zona 4. La percentuale accanto al nome è l'efficienza in attacco (punti meno errori e murate, sugli attacchi). Formazione: la più usata in ciascuna rotazione nei file.</p>`;
}
function rosterTable(key, team) {
  const list = Object.values(team.P).filter(p => p.aN + p.sN + p.rN > 0).sort((x, y) => (x.role === 1) - (y.role === 1) || y.aN - x.aN);
  const r = v => v == null ? '–' : Math.round(v * 100) + '%';
  return `<div class="panel"><h3>${esc(teamName(key))}</h3><div class="tbl-wrap"><table>
    <thead><tr><th>N.</th><th>Giocatrice</th><th>Ruolo</th><th class="r">Att.</th><th class="r">Punti%</th><th class="r">Eff.</th><th class="r">Ace</th><th class="r">Err. batt.</th><th class="r">Muri</th><th class="r">Ric. pos.</th></tr></thead>
    <tbody>${list.map(p => `<tr><td class="num">${p.num}</td><td>${esc(p.last)} <span class="n">${esc(p.first)}</span></td><td>${(ROLE[p.role] || ['', '–'])[1]}</td><td class="r num">${p.aN || ''}</td><td class="r num">${p.aN ? r(p.kill) : ''}</td><td class="r num ${p.eff == null ? '' : p.eff >= 0.25 ? 'hi' : p.eff < 0.12 ? 'lo' : ''}">${p.aN ? r(p.eff) : ''}</td><td class="r num">${p.sN ? p.sA : ''}</td><td class="r num">${p.sN ? p.sE : ''}</td><td class="r num">${p.bK || ''}</td><td class="r num">${p.rN ? r(p.rG / p.rN) + ` <span class="n">${p.rN}</span>` : ''}</td></tr>`).join('') || '<tr><td colspan="10" class="empty">Ricarica i file .dvw per vedere le giocatrici.</td></tr>'}</tbody></table></div></div>`;
}


// ---------- battuta ----------
const STYPE = { M: 'salto float', Q: 'salto spin', H: 'float', T: 'tesa', O: 'altro' };
function serveData() {
  const k = 'sv|' + S.myKey + '|' + S.oppKey;
  if (cache.sv && cache.sv.k === k) return cache.sv;
  cache.sv = { k, ss: RC.serverStats(S.matches, S.myKey), rs: RC.receptionStats(S.matches, S.oppKey), sd: RC.setStats(S.matches, S.oppKey) };
  return cache.sv;
}
const pname = (team, n) => {
  const p = team.P[n]; if (!p) return `#${n}`;
  const dup = Object.values(team.P).some(q => q.num !== p.num && q.last === p.last);
  return `#${n} ${esc(p.last)}${dup && p.first ? ' ' + esc(p.first[0]) + '.' : ''}`;
};
const prole = (team, n) => { const p = team.P[n]; return p && ROLE[p.role] ? ROLE[p.role][1].toLowerCase() : ''; };
// campo avversario visto dalla nostra battitrice: in alto il fondo (1 6 5), poi 9 8 7, sotto rete 2 3 4
function miniCourt(t, best) {
  const rows = [[1, 6, 5], [9, 8, 7], [2, 3, 4]];
  const vals = t.zones.filter(z => z.n >= 2).map(z => z.so);
  const mean = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0.5;
  return `<div class="court" aria-label="Campo avversario: cambio palla per zona di arrivo della battuta">${rows.map(r => r.map(z => {
    const o = t.zoneMap[z];
    const bg = o && o.n >= 2 ? heatColor(1 - o.so, 1 - mean, 0.15) : 'var(--sunk)';
    return `<span class="cz${z === best ? ' tg' : ''}" style="background:${bg}"><b>${z}</b>${o ? `<i class="num">${pc(o.so)}</i>` : ''}</span>`;
  }).join('')).join('')}<span class="cnet">rete</span></div>`;
}
function servePlan(a0, b0, firstServer) {
  const m = model(), pp = people(), { ss, rs } = serveData();
  if (!rs.all.n) return '<p class="note">Nei file non ci sono dati di ricezione per questo avversario.</p>';
  const ph = RC.phases(m.A.est, m.B.est, m.L, a0, b0, firstServer).filter(x => x.sv === 0).slice(0, 6);
  return `<div class="plan">${ph.map(({ a, b }) => {
    const t = RC.serveTarget(rs, b);
    const srv = ss.byRot[a] ?? (pp.my.L[a] ? pp.my.L[a].zones[0] : null);
    const sp = srv != null ? ss.players[srv] : null;
    const base = rs.all.n ? rs.all.so / rs.all.n : 0.55;
    const so = (t.n * (t.so || 0) + 8 * base) / (t.n + 8); // cambio palla con battuta in campo, corretto verso la media
    const risk = so >= 0.6 ? ['push', 'Spingi', `Con battuta in campo fanno cambio palla il ${pc(so)}: rischia, un errore costa poco.`]
      : so <= 0.47 ? ['safe', 'In campo', `Qui faticano (${pc(so)} di cambio palla): battuta sicura sul bersaglio, non regalare il punto.`]
      : ['aim', 'Mirata', `Con battuta in campo fanno cambio palla il ${pc(so)}, nella media: battuta piena ma mirata.`];
    const goodZ = t.zones.filter(z => z.n >= 3);
    const bestZ = goodZ.length ? goodZ[0].z : null;
    const [t1, t2] = t.rcv;
    const tgt = r => `${pname(pp.opp, r.num)}<span class="n"> ${prole(pp.opp, r.num)}</span>`;
    const typ = sp ? Object.entries(sp.types).sort((x, y) => y[1] - x[1]).map(([k]) => STYPE[k] || k).join(' / ') : '';
    return `<div class="pc">
      <div class="pch"><b>Loro P${b} in ricezione</b><span class="risk ${risk[0]}">${risk[1]}</span></div>
      <p class="srv">Batte ${srv != null ? pname(pp.my, srv) : '?'} <span class="n">(noi in P${a}${typ ? ' · ' + typ : ''}${sp ? ` · ${sp.ace} ace, ${sp.err} errori su ${sp.n}` : ''})</span></p>
      <div class="pcb">
        <div class="tg-list">
          ${t1 ? `<p><span class="lbl">Bersaglio</span><br><b>${tgt(t1)}</b><br><span class="n">Cambio palla ${pc(t1.raw.so / t1.raw.n)} quando riceve lei (${t1.n} ric. in P${b})${t1.zone ? `, di solito in zona ${t1.zone}` : ''}</span></p>` : '<p class="n">Ricezioni insufficienti in questa rotazione.</p>'}
          ${t2 ? `<p><span class="lbl">Alternativa</span><br>${tgt(t2)} <span class="n">${pc(t2.raw.so / t2.raw.n)} (${t2.n})</span></p>` : ''}
          ${bestZ ? `<p><span class="lbl">Zona</span><br>zona ${bestZ} <span class="n">cambio palla ${pc(t.zoneMap[bestZ].so)}</span></p>` : ''}
        </div>
        ${miniCourt(t, bestZ)}
      </div>
      ${setLine(b, bestZ || (t1 && t1.zone) || 0)}
      <p class="n">${risk[2]}</p>
    </div>`;
  }).join('')}</div>
  <p class="note" style="margin-top:8px">Le 6 battute del primo giro con questo incrocio di partenze. Il campo è visto dalla battitrice: in alto il fondo (zone 1, 6, 5), in basso la rete; il colore indica dove la loro ricezione rende meno (verde = cambio palla più basso). Con pochi dati per zona o giocatrice i valori vengono avvicinati alla media della squadra.</p>`;
}
function serveTables() {
  const pp = people(), { ss, rs } = serveData();
  const r = v => v == null || isNaN(v) ? '–' : Math.round(v * 100) + '%';
  const sv = Object.values(ss.players).filter(p => p.n >= 3).sort((a, b) => b.n - a.n);
  const rc = Object.entries(rs.players).filter(([, o]) => o.n >= 5).map(([n, o]) => ({ num: +n, ...o })).sort((a, b) => b.n - a.n);

    <div class="panel"><h3>Le nostre battitrici · ${esc(teamName(S.myKey))}</h3><div class="tbl-wrap"><table>
      <thead><tr><th>Giocatrice</th><th class="r">Batt.</th><th class="r">Ace</th><th class="r">Err.</th><th class="r">Break</th><th class="r" title="Ricezione avversaria positiva o perfetta">Ric. avv. pos.</th></tr></thead>
      <tbody>${sv.map(p => `<tr><td>${pname(pp.my, p.num)}</td><td class="r num">${p.n}</td><td class="r num">${p.ace}</td><td class="r num">${p.err}</td><td class="r num">${r(p.won / p.n)}</td><td class="r num ${p.rec && p.recPos / p.rec <= 0.25 ? 'hi' : p.rec && p.recPos / p.rec >= 0.45 ? 'lo' : ''}">${r(p.recPos / p.rec)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nessun dato</td></tr>'}</tbody></table></div></div>
    <div class="panel"><h3>La loro ricezione · ${esc(teamName(S.oppKey))}</h3><div class="tbl-wrap"><table>
      <thead><tr><th>Giocatrice</th><th class="r">Ric.</th><th class="r">Perfetta</th><th class="r">Positiva</th><th class="r">Errori</th><th class="r">Cambio palla</th></tr></thead>
      <tbody>${rc.map(o => `<tr><td>${pname(pp.opp, o.num)} <span class="n">${prole(pp.opp, o.num)}</span></td><td class="r num">${o.n}</td><td class="r num">${r(o.perf / o.n)}</td><td class="r num ${o.pos / o.n <= 0.25 ? 'hi' : ''}">${r(o.pos / o.n)}</td><td class="r num">${o.err}</td><td class="r num ${o.so / o.n <= 0.45 ? 'hi' : o.so / o.n >= 0.6 ? 'lo' : ''}">${r(o.so / o.n)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nessun dato</td></tr>'}</tbody></table></div></div>
  </section>`;
}


// ---------- distribuzione alzata ----------
const SL = { '4': 'Zona 4', '3': 'Centro', '2': 'Zona 2', 'P': 'Pipe', '1': '2ª linea da 1', '5': '2ª linea da 5', 'D': '2° tocco palleggiatrice' };
const SLS = { '4': 'Z4', '3': 'Centro', '2': 'Z2', 'P': 'Pipe', '1': '2ª l. da 1', '5': '2ª l. da 5', 'D': '2° tocco' };
function setLine(b, zone) {
  const { sd } = serveData(); const r = RC.setDistribution(sd, b, zone || 0, '*');
  if (!r.nRot) return '';
  const top = RC.SETZ.filter(z => r.d[z] >= 0.08).sort((x, y) => r.d[y] - r.d[x]);
  return `<p class="setl"><span class="lbl">Alzata probabile${zone ? ` se la battuta arriva in zona ${zone}` : ''}</span><br>${top.map(z => `<b>${SLS[z]}</b> <span class="num">${pc(r.d[z])}</span>`).join(' · ')} <span class="n">(${r.n} attacchi)</span></p>`;
}
function setSection() {
  const pp = people(), { sd } = serveData();
  const b = S.srot, r = RC.setDistribution(sd, b, S.sland, S.sq);
  if (!r.nRot) return '<p class="note">Nei file non ci sono attacchi dopo ricezione per questa rotazione.</p>';

  const lineup = pp.opp.L[b];
  return `
    <div class="row" style="margin-bottom:12px">
      <div class="field"><span class="lbl">Loro rotazione in ricezione</span><div class="chips">${[1, 2, 3, 4, 5, 6].map(i => chip('srot', i, S.srot, 'P' + i)).join('')}</div></div>
      <div class="field"><span class="lbl">Loro ricezione</span><div class="chips">${chip('sq', '*', S.sq, 'Tutte', 'wide')}${chip('sq', 'pos', S.sq, 'Positiva', 'wide')}${chip('sq', 'mid', S.sq, 'Media', 'wide')}${chip('sq', 'neg', S.sq, 'Negativa', 'wide')}</div></div>
    </div>
    <div class="setgrid">
      <div class="landpick">
        <span class="lbl">Dove arriva la nostra battuta</span>
        <div class="court big">${[[1, 6, 5], [9, 8, 7], [2, 3, 4]].map(row => row.map(z => `<button class="cz pick" data-sland="${z}" aria-pressed="${String(S.sland === z)}"><b>${z}</b><i class="num">${r.land[z] || 0} batt.</i></button>`).join('')).join('')}<span class="cnet">rete</span></div>
        <button class="chip wide" data-sland="0" aria-pressed="${String(!S.sland)}">Tutte le zone</button>
        <p class="n">Visto dalla battitrice: in alto il loro fondo campo. Il numero è quante battute sono arrivate lì in questa rotazione.</p>
      </div>
      <div class="setcourt" aria-label="Campo avversario visto dal nostro lato">
        <div class="szrow">${cell('1')}${cell('P')}${cell('5')}</div>
        <div class="szrow">${cell('2')}${cell('3')}${cell('4')}</div>
        <div class="netline"><span>rete · il nostro lato</span></div>
        ${r.d.D >= 0.03 ? `<p class="n" style="margin-top:6px">${SL.D}: <b class="num">${pc(r.d.D)}</b></p>` : ''}
      </div>
      <div class="setinfo">
        <p><b>${r.n}</b> attacchi dopo ricezione ${S.sland ? `con battuta in zona ${S.sland}` : 'in questa rotazione'}${S.sq !== '*' ? ' e ricezione ' + ({ pos: 'positiva', mid: 'media', neg: 'negativa' })[S.sq] : ''} (${r.nRot} in P${b} in totale). ${r.n < 8 ? 'Pochi dati: la stima si appoggia soprattutto alla media della rotazione.' : ''}</p>
        ${lineup ? (() => { const f = frontSwitched(pp.opp, lineup.zones); return `<p class="n">Prima linea dopo i cambi: ${[4, 3, 2].map(z => pname(pp.opp, f[z]) + ' in ' + z).join(', ')}. Palleggiatrice in zona ${b} di rotazione.</p>`; })() : ''}
        <p class="note">Il campo è visto dal vostro lato della rete: in basso la loro prima linea (zona 2 a sinistra, zona 4 a destra), in alto la seconda linea. Per ogni zona: quota di primi attacchi dopo ricezione, attaccante più frequente e punti fatti su attacchi.</p>
      </div>
    </div>`;
}

// ---------- render ----------
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const main = $('#main');
  if (!S.matches.length && S.tab !== 'data') { main.innerHTML = `<section class="panel"><h2>Nessuna partita caricata</h2><p class="note" style="margin-bottom:12px">Vai alla scheda Dati e carica i file .dvw delle vostre partite e di quelle dell'avversario. Restano solo su questo dispositivo.</p><button class="btn" data-tab="data">Vai a Dati</button></section>`; save(); return; }
  if (S.tab === 'bench') main.innerHTML = renderBench();
  else if (S.tab === 'study') main.innerHTML = renderStudy();
  else main.innerHTML = renderData();
  save();
}

const chip = (attr, val, cur, label, cls = '') => `<button class="chip ${cls}" data-${attr}="${val}" aria-pressed="${String(cur === val)}">${label}</button>`;
const pChips = (attr, cur, cls) => [1, 2, 3, 4, 5, 6].map(i => chip(attr, i, cur, 'P' + i, cls)).join('');

function renderBench() {
  const b = S.bench;
  if (S.myKey === S.oppKey) return `<section class="panel"><p class="warn">Scegli due squadre diverse in alto.</p></section>`;
  const target = b.set === 5 ? 15 : 25;
  const M = mat(b.weServe ? 0 : 1, target);
  const rows = oppRows(true);
  const prevLog = b.log.find(l => l.set === b.set - 1);
  const prevOppServe = prevLog ? prevLog.oppServe : (b.set === 5 ? null : b.weServe);
  const prevEq = b.set > 1 && b.prevOppStart ? RC.eqRot(b.prevOppStart, prevOppServe == null ? true : prevOppServe) : null;
  const pr = RC.predict(rows, { set: b.set, prevEq, prevWon: b.set > 1 ? b.prevOppWon : null, oppServeFirst: !b.weServe });
  const dist = b.known ? Object.fromEntries([1, 2, 3, 4, 5, 6].map(i => [i, i === b.known ? 1 : 0])) : pr.dist;
  const exp = {}; for (let a = 1; a <= 6; a++) { exp[a] = 0; for (let x = 1; x <= 6; x++) exp[a] += dist[x] * M[a][x]; }
  const order = [1, 2, 3, 4, 5, 6].sort((x, y) => exp[y] - exp[x]);
  const best = order[0], worst = order[5];
  const topOpp = [1, 2, 3, 4, 5, 6].sort((x, y) => dist[y] - dist[x]);
  const bestVs = x => { let a = 1; for (let i = 2; i <= 6; i++) if (M[i][x] > M[a][x]) a = i; return a; };

  const myBars = order.map(a => `<div class="bar${a === best ? ' best' : ''}"><b>P${a}</b><span class="t"><i style="width:${(exp[a] * 100).toFixed(1)}%"></i><span class="mid"></span></span><span class="v num">${pc(exp[a])}</span></div>`).join('');
  const oppBars = [1, 2, 3, 4, 5, 6].map(x => `<div class="bar"><b>P${x}</b><span class="t"><i style="width:${(dist[x] * 100).toFixed(1)}%;background:var(--hot)"></i></span><span class="v num">${pc(dist[x])}</span></div>`).join('');
  const nSets = rows.length;
  const likely = topOpp.filter(x => dist[x] >= 0.12).slice(0, 3);

  const endOpp = b.endOpp ?? b.known ?? topOpp[0], endMy = b.endMy ?? best;
  return `
  <section class="panel">
    <h2>Set ${b.set}</h2>
    <div class="bench-form">
      <div class="row">
        <div class="field"><span class="lbl">Set</span><div class="chips">${[1, 2, 3, 4, 5].map(i => chip('set', i, b.set, i)).join('')}</div></div>
        <div class="field"><span class="lbl">Batte per primo</span><div class="chips">${chip('serve', 1, b.weServe ? 1 : 0, 'Noi', 'wide')}${chip('serve', 0, b.weServe ? 1 : 0, 'Loro', 'wide')}</div></div>
      </div>
      ${b.set > 1 ? `<div class="row">
        <div class="field"><span class="lbl">Loro partenza nel set ${b.set - 1}</span><div class="chips">${pChips('prev', b.prevOppStart)}</div></div>
        <div class="field"><span class="lbl">Set ${b.set - 1} vinto da</span><div class="chips">${chip('pwon', 0, b.prevOppWon === false ? 0 : b.prevOppWon === true ? 1 : -1, 'Noi', 'wide')}${chip('pwon', 1, b.prevOppWon === false ? 0 : b.prevOppWon === true ? 1 : -1, 'Loro', 'wide')}</div></div>
      </div>` : ''}
      <div class="field"><span class="lbl">Partenza avversaria già nota (facoltativo)</span><div class="chips">${pChips('known', b.known, 'ghost')}</div></div>
    </div>
  </section>

  <section class="grid2">
    <div class="panel">
      <div class="verdict">
        <span class="big">P${best}</span>
        <span class="k">Parti in P${best}</span>
        <span class="s">Probabilità stimata di vincere il set: <b class="num">${pc(exp[best])}</b>. Da evitare: P${worst} (${pc(exp[worst])}).</span>
      </div>
      <h3 style="margin-top:14px">Le tue 6 partenze</h3>
      <div class="bars">${myBars}</div>
      <p class="note" style="margin-top:10px">${likely.map(x => `Se partono in P${x}: meglio P${bestVs(x)} (${pc(M[bestVs(x)][x])}).`).join(' ')}</p>
    </div>
    <div class="panel">
      <h3>${b.known ? 'Partenza avversaria nota' : 'Previsione partenza ' + esc(teamName(S.oppKey))}</h3>
      <div class="bars">${oppBars}</div>
      <p class="note" style="margin-top:10px">${b.known ? 'Hai indicato la loro partenza: la scelta usa solo quella.' :
        `Basata su ${nSets} set${pr.pKeep != null ? `; dopo un set ${b.prevOppWon ? 'vinto' : b.prevOppWon === false ? 'perso' : ''} confermano lo schieramento nel ${pc(pr.pKeep)} dei casi` : ''}.${nSets < 8 ? ' Pochi dati: considera la previsione indicativa.' : ''}`}</p>
    </div>
  </section>

  <details class="panel" id="benchPlan"${S.planOpen ? ' open' : ''}>
    <summary><h2 style="display:inline">Piano di battuta</h2> <span class="n">noi P${best} contro loro P${b.known || topOpp[0]}</span></summary>
    ${servePlan(best, b.known || topOpp[0], b.weServe ? 0 : 1)}
  </details>

  <details class="panel" id="benchSet"${S.setOpen ? ' open' : ''}>
    <summary><h2 style="display:inline">Distribuzione dell'alzata</h2> <span class="n">loro P${S.srot} in ricezione</span></summary>
    ${setSection()}
  </details>

  <details class="panel" id="benchNets"${S.netsOpen ? ' open' : ''}>
    <summary><h2 style="display:inline">Incroci giocatrici</h2> <span class="n">noi P${best} contro loro P${b.known || topOpp[0]}</span></summary>
    ${phaseNets(best, b.known || topOpp[0], b.weServe ? 0 : 1, M)}
  </details>

  <section class="panel">
    <h2>Fine set ${b.set}</h2>
    <div class="endset">
      <div class="row">
        <div class="field"><span class="lbl">Loro sono partiti in</span><div class="chips">${pChips('eopp', endOpp)}</div></div>
        <div class="field"><span class="lbl">Noi siamo partiti in</span><div class="chips">${pChips('emy', endMy)}</div></div>
      </div>
      <div class="row" style="align-items:flex-end">
        <div class="field"><span class="lbl">Set vinto da</span><div class="chips">${chip('ewin', 'noi', b.endWin, 'Noi', 'wide')}${chip('ewin', 'loro', b.endWin, 'Loro', 'wide')}</div></div>
        <div class="field" style="flex:0 1 auto"><button class="btn" data-act="endset"${b.endWin ? '' : ' disabled style="opacity:.5"'}>Registra e passa al set ${Math.min(5, b.set + 1)}</button></div>
      </div>
      ${b.log.length ? `<div class="log">${b.log.map(l => `<div><b>Set ${l.set}</b><span>Loro P${l.oppStart}${l.oppServe ? ' (battuta)' : ' (ricezione)'}</span><span>Noi P${l.myStart}</span><span class="tag ${l.oppWon ? 'l' : 'w'}">${l.oppWon ? 'Perso' : 'Vinto'}</span></div>`).join('')}</div>
      <div><button class="btn sec small" data-act="newmatch">Nuova partita</button></div>` : '<p class="note">I set registrati qui aggiornano la previsione per il set successivo.</p>'}
    </div>
  </section>`;
}

function rotTable(key, st) {
  const rows = [1, 2, 3, 4, 5, 6].map(i => {
    const r = st.rot[i]; const so = r.soN ? r.soW / r.soN : null, bp = r.bpN ? r.bpW / r.bpN : null;
    const cls = (v, avg) => v == null ? '' : v - avg >= 0.08 ? 'hi' : avg - v >= 0.08 ? 'lo' : '';
    const cell = (v, n, avg) => `<td class="r"><span class="pct"><s style="width:${v == null ? 0 : Math.round(v * 40)}px"></s><span class="num ${cls(v, avg)}">${pc(v)}</span></span> <span class="n num">${n}</span></td>`;
    return `<tr><td><b class="rh">P${i}</b></td>${cell(so, r.soN, st.so)}${cell(bp, r.bpN, st.bp)}</tr>`;
  }).join('');
  return `<div class="panel"><h3>${esc(teamName(key))}</h3><div class="tbl-wrap"><table>
    <thead><tr><th>Rot.</th><th class="r">Cambio palla</th><th class="r">Break</th></tr></thead>
    <tbody>${rows}<tr><td><b>Tot</b></td><td class="r num">${pc(st.so)} <span class="n">${st.soN}</span></td><td class="r num">${pc(st.bp)} <span class="n">${st.bpN}</span></td></tr></tbody></table></div></div>`;
}

function findings(rows) {
  const p = RC.patterns(rows);
  if (!p.n) return `<p class="empty">Nessun set di questa squadra nei file caricati.</p>`;
  const L = [];
  const t = p.top, tr = t === 6 ? 1 : t + 1;
  L.push([p.topShare >= 0.6, `Schieramento abituale: va al primo servizio in <b>P${t}</b> in <b>${p.eq[t]} set su ${p.n}</b>. In pratica parte in P${t} quando batte e in P${tr} quando riceve.`]);
  const list = o => [1, 2, 3, 4, 5, 6].filter(i => o[i]).map(i => `P${i} ×${o[i]}`).join(', ') || '–';
  L.push([false, `Quando batte per primo: ${list(p.serve)}. Quando riceve: ${list(p.recv)}.`]);
  if (p.nW + p.nL) {
    const kw = p.nW ? p.keepW / p.nW : null, kl = p.nL ? p.keepL / p.nL : null;
    let read = '';
    if (kw != null && kl != null) {
      if (kw >= 0.7 && kl >= 0.7) read = ' Non cambia in base al risultato.';
      else if (kw >= 0.6 && kl < 0.5) read = ' Conferma quando vince, cambia quando perde.';
      else if (kw < 0.5 && kl < 0.5) read = ' Cambia spesso tra un set e l\'altro.';
    }
    L.push([read === ' Non cambia in base al risultato.' || read.startsWith(' Conferma'), `Dopo un set vinto conferma lo schieramento ${p.keepW}/${p.nW} volte, dopo un set perso ${p.keepL}/${p.nL}.${read}`]);
  }
  const diff = Object.entries(p.byOpp).map(([o, rs]) => {
    const c = {}; rs.forEach(r => c[r.eq] = (c[r.eq] || 0) + 1);
    const mode = +Object.keys(c).sort((a, b) => c[b] - c[a])[0];
    return { o, rs, mode };
  });
  const odd = diff.filter(d => d.mode !== t);
  L.push([odd.length > 0, odd.length ? `Contro ${odd.map(d => `<b>${esc(d.o)}</b> (schieramento P${d.mode} al servizio)`).join(', ')} ha cambiato rispetto al solito: segnale di adattamento all'avversario.` : `Usa lo stesso schieramento contro tutti gli avversari nei file (${diff.length}).`]);
  if (p.follow) L.push([false, `In ${p.follow} casi su ${p.nFollow} ha spostato la partenza per ritrovare lo stesso incrocio del set precedente con l'avversario.`]);
  return `<ul class="findings">${L.map(([s, x]) => `<li class="${s ? 'strong' : ''}">${x}</li>`).join('')}</ul>`;
}

function heatColor(v, mean, dev) {
  const d = (v - mean) / dev; const amt = Math.min(70, Math.abs(d) * 70);
  return `color-mix(in oklab, var(${d >= 0 ? '--good' : '--bad'}) ${amt.toFixed(0)}%, var(--sunk))`;
}

function renderStudy() {
  if (S.myKey === S.oppKey) return `<section class="panel"><p class="warn">Scegli due squadre diverse in alto.</p></section>`;
  const m = model();
  const M = mat(S.studyServe, 25);
  const vals = []; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) vals.push(M[a][b]);
  const mean = vals.reduce((s, v) => s + v, 0) / 36, dev = Math.max(0.03, ...vals.map(v => Math.abs(v - mean)));
  let heat = `<span></span>${[1, 2, 3, 4, 5, 6].map(b => `<span class="h">Loro P${b}</span>`).join('')}`;
  for (let a = 1; a <= 6; a++) {
    heat += `<span class="rh">P${a}</span>` + [1, 2, 3, 4, 5, 6].map(b => `<button data-cell="${a}-${b}" aria-pressed="${String(S.sel === a + '-' + b)}" style="background:${heatColor(M[a][b], mean, dev)}" aria-label="Noi P${a} contro loro P${b}: ${pc(M[a][b])}">${Math.round(M[a][b] * 100)}</button>`).join('');
  }
  let phases = '';
  if (S.sel) {
    const [a, b] = S.sel.split('-').map(Number);
    phases = `<h3 style="margin-top:16px">Incroci giocatrici: noi P${a} contro loro P${b}, ${S.studyServe === 0 ? 'battiamo noi' : 'battono loro'}</h3>` + phaseNets(a, b, S.studyServe, M);
  }
  let planA, planB, planLabel;
  if (S.sel) { [planA, planB] = S.sel.split('-').map(Number); planLabel = `Incrocio selezionato: noi P${planA} contro loro P${planB}, ${S.studyServe === 0 ? 'battiamo per primi' : 'battono loro per primi'}.`; }
  else {
    const pr = RC.predict(RC.startHistory(S.matches, S.oppKey), { set: 1, oppServeFirst: S.studyServe === 1 });
    planB = [1, 2, 3, 4, 5, 6].sort((x, y) => pr.dist[y] - pr.dist[x])[0];
    const ex = a => [1, 2, 3, 4, 5, 6].reduce((t, x) => t + pr.dist[x] * M[a][x], 0);
    planA = [1, 2, 3, 4, 5, 6].sort((x, y) => ex(y) - ex(x))[0];
    planLabel = `Partenza consigliata P${planA} contro la loro più probabile P${planB} (1° set, ${S.studyServe === 0 ? 'battiamo per primi' : 'battono loro per primi'}). Tocca una casella della tabella per un altro incrocio.`;
  }
  const key = S.hist === 'opp' ? S.oppKey : S.myKey;
  const rows = RC.startHistory(S.matches, key);
  const coach = coachOf(S.oppKey);
  const anyMy = m.A.st.soN + m.A.st.bpN, anyOpp = m.B.st.soN + m.B.st.bpN;
  const jumps = [['st-pattern', 'Pattern'], ['st-matchup', 'Matchup'], ['st-battuta', 'Piano di battuta'], ['st-alzata', 'Alzata'], ['st-battitrici', 'Battuta e ricezione'], ['st-rot', 'Rotazioni'], ['st-rose', 'Giocatrici'], ['st-storico', 'Storico']];
  return `
  <nav class="jump" aria-label="Sezioni di Studio">${jumps.map(([id, l]) => `<button class="chip wide" data-jump="${id}">${l}</button>`).join('')}</nav>

  <section class="panel" id="st-pattern">
    <h2>Pattern di ${esc(teamName(S.oppKey))}${coach ? ` <span class="n" style="font-family:var(--f-body);text-transform:none;font-size:14px;font-weight:500">coach ${esc(coach)}</span>` : ''}</h2>
    ${findings(RC.startHistory(S.matches, S.oppKey))}
  </section>

  <section class="panel" id="st-matchup">
    <h2>Matchup delle partenze</h2>
    <div class="row" style="margin-bottom:12px"><div class="field"><span class="lbl">Batte per primo</span><div class="chips">${chip('sserve', 0, S.studyServe, 'Noi', 'wide')}${chip('sserve', 1, S.studyServe, 'Loro', 'wide')}</div></div></div>
    <div class="tbl-wrap"><div class="heat">${heat}</div></div>
    <div class="legend"><span>Probabilità di vincere il set (%). Righe: nostra partenza.</span><span>peggio</span><i></i><span>meglio della media della tabella</span></div>
    ${phases || '<p class="note" style="margin-top:10px">Tocca una casella per vedere gli incroci giocatrice per giocatrice, rotazione per rotazione.</p>'}
    ${(!anyMy || !anyOpp) ? '<p class="warn" style="margin-top:10px">Una delle due squadre non ha rally nei file: per lei uso la media di tutte le partite caricate.</p>' : ''}
  </section>

  <section class="panel" id="st-battuta">
    <h2>Piano di battuta</h2>
    <p class="note" style="margin-bottom:10px">${planLabel}</p>
    ${servePlan(planA, planB, S.studyServe)}
  </section>

  <section class="panel" id="st-alzata">
    <h2>Distribuzione dell'alzata</h2>
    ${setSection()}
  </section>

  <div id="st-battitrici">${serveTables()}</div>


  <section class="grid2" id="st-rot">${rotTable(S.myKey, m.A.st)}${rotTable(S.oppKey, m.B.st)}</section>
  <section style="display:grid;gap:18px" id="st-rose">${rosterTable(S.myKey, people().my)}${rosterTable(S.oppKey, people().opp)}</section>
  <p class="note">Rotazione = posizione del palleggiatore (P1 = palleggiatore in zona 1), come in DataVolley. I numeri piccoli sono i rally giocati in quella rotazione; il modello corregge verso la media della squadra quando sono pochi.</p>

  <section class="panel" id="st-storico">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0">Storico partenze</h2>
      <div class="chips">${chip('hist', 'opp', S.hist, esc(teamName(S.oppKey)), 'wide')}${chip('hist', 'my', S.hist, esc(teamName(S.myKey)), 'wide')}</div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Data</th><th>Contro</th><th>Set</th><th>Partenza</th><th>Inizio</th><th>Al servizio</th><th>Avversario</th><th class="r">Punteggio</th></tr></thead>
      <tbody>${rows.map((r, i) => { const eq = RC.eqRot(r.start, r.serveFirst); const first = i === 0 || rows[i - 1].match !== r.match;
        return `<tr${first && i ? ' style="border-top:2px solid var(--line)"' : ''}><td class="num">${first ? fmtDate(r.date) : ''}</td><td>${first ? esc(r.opp) : ''}</td><td class="num">${r.set}</td><td><b>P${r.start}</b></td><td>${r.serveFirst ? 'Battuta' : 'Ricezione'}</td><td>P${eq}</td><td>P${r.oppStart}</td><td class="r"><span class="tag ${r.won ? 'w' : r.won === false ? 'l' : ''}">${r.score.join('-')}</span></td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Nessun dato</td></tr>'}</tbody>
    </table></div>
    <p class="note" style="margin-top:8px">"Al servizio" è la rotazione con cui la squadra va al primo servizio: chi riceve in P2 e fa cambio palla serve in P1, quindi è lo stesso schieramento di chi parte in battuta in P1.</p>
  </section>`;
}

async function addFiles(files) {
  const msg = []; let added = 0;
  for (const f of files) {
    try {
      const txt = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f, 'windows-1252'); });
      const m = RC.parseDVW(txt, f.name);
      if (!m.sets.length) { msg.push(`${f.name}: nessun set con rally trovato.`); continue; }
      if (S.matches.some(x => x.id === m.id)) { msg.push(`${f.name}: già caricato.`); continue; }
      S.matches = S.matches.concat([m]); added++;
    } catch (e) { msg.push(`${f.name}: file non leggibile (${e.message}).`); }
  }
  if (added) { S.customData = true; invalidate(); ensureTeams(); }
  render();
  const el = $('#loadMsg'); if (el) el.textContent = `${added} partite aggiunte.` + (msg.length ? ' ' + msg.join(' ') : '');
}

// ---------- eventi ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset, b = S.bench;
  if (d.tab) { S.tab = d.tab; window.scrollTo({ top: 0 }); return render(); }
  if (d.jump) { const el = document.getElementById(d.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (d.set) { b.set = +d.set; b.endWin = null; b.endOpp = null; b.endMy = null; }
  else if (d.serve) b.weServe = d.serve === '1';
  else if (d.prev) b.prevOppStart = +d.prev;
  else if (d.pwon) b.prevOppWon = d.pwon === '1';
  else if (d.known) b.known = b.known === +d.known ? null : +d.known;
  else if (d.eopp) b.endOpp = +d.eopp;
  else if (d.emy) b.endMy = +d.emy;
  else if (d.ewin) b.endWin = d.ewin;
  else if (d.act === 'endset') {
    if (!b.endWin) return;
    const oppStart = +t.closest('.endset').querySelector('[data-eopp][aria-pressed="true"]').dataset.eopp;
    const myStart = +t.closest('.endset').querySelector('[data-emy][aria-pressed="true"]').dataset.emy;
    b.log = b.log.filter(l => l.set !== b.set).concat([{ set: b.set, oppStart, myStart, oppServe: !b.weServe, oppWon: b.endWin === 'loro' }]).sort((x, y) => x.set - y.set);
    b.prevOppStart = oppStart; b.prevOppWon = b.endWin === 'loro';
    if (b.set < 5) { b.set++; if (b.set < 5) b.weServe = !b.weServe; }
    b.known = null; b.endOpp = null; b.endMy = null; b.endWin = null;
    window.scrollTo({ top: 0 });
  }
  else if (d.act === 'newmatch') S.bench = freshBench();
  else if (d.sserve) { S.studyServe = +d.sserve; }
  else if (d.cell) S.sel = S.sel === d.cell ? null : d.cell;
  else if (d.hist) S.hist = d.hist;
  else if (d.srot) S.srot = +d.srot;
  else if (d.sland != null) S.sland = +d.sland;
  else if (d.sq) S.sq = d.sq;
  else if (d.del != null) { S.matches = S.matches.filter((_, i) => i !== +d.del); S.customData = true; invalidate(); ensureTeams(); }
  else if (d.act === 'reset') { S.matches = SAMPLE; S.customData = false; invalidate(); ensureTeams(); }
  else return;
  render();
});
document.addEventListener('toggle', e => { if (e.target.id === 'benchNets') S.netsOpen = e.target.open; if (e.target.id === 'benchPlan') S.planOpen = e.target.open; if (e.target.id === 'benchSet') S.setOpen = e.target.open; }, true);
document.addEventListener('change', e => {
  if (e.target.id === 'selMy') { S.myKey = e.target.value; S.sel = null; invalidate(); ensureTeams(); render(); }
  if (e.target.id === 'selOpp') { S.oppKey = e.target.value; S.sel = null; invalidate(); ensureTeams(); render(); }
  if (e.target.id === 'fileIn') addFiles([...e.target.files]);
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('#drop'); if (!z) return;
  e.preventDefault(); z.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop') addFiles([...e.dataTransfer.files].filter(f => /\.dvw$/i.test(f.name)));
}));

ensureTeams();
render();

</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
