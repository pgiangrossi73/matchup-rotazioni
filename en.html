<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3fd4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%}</style>
<title>Rotation Matchup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra squadre fissa in alto, tre schede (Panchina per il telefono, Studio per il laptop, Dati); colori MySportee viola/arancio */
:root {
  --bg: #f4f3f8; --surface: #ffffff; --sunk: #ebe9f2; --ink: #1d1a2e; --muted: #67627d; --line: #dedbe8;
  --accent: #5a3fd4; --accent-ink: #ffffff; --hot: #e9661c; --good: #17905f; --bad: #cf3f3f;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12101b; --surface: #1b1828; --sunk: #242036; --ink: #eeebf8; --muted: #9d97b4; --line: #302b45;
  --accent: #9b86ff; --accent-ink: #14111f; --hot: #ff8b45; --good: #3cc58c; --bad: #f06d6d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12101b; --surface: #1b1828; --sunk: #242036; --ink: #eeebf8; --muted: #9d97b4; --line: #302b45;
  --accent: #9b86ff; --accent-ink: #14111f; --hot: #ff8b45; --good: #3cc58c; --bad: #f06d6d; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, select:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .01em; text-transform: uppercase; line-height: 1 }
.brand b { color: var(--hot) }
.teams { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1 1 340px }
.teams label { display: flex; flex-direction: column; gap: 2px; flex: 1 1 140px; min-width: 0 }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
select { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 600 }
.vs { font-family: var(--f-display); font-weight: 700; color: var(--muted); padding-top: 14px }
nav.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 9px }
nav.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; font-weight: 600; color: var(--muted) }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }

main { padding-block: 18px 40px; display: grid; gap: 18px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0 }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 10px; text-wrap: balance }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; font-weight: 600 }
p { margin: 0 }
.note { color: var(--muted); font-size: 13px; max-width: 70ch }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)) }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

/* controlli a chip */
.field { display: grid; gap: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 0; min-width: 46px; font-weight: 600; text-align: center }
.chip.wide { padding: 8px 14px }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.chip.ghost[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff }
.bench-form { display: grid; gap: 14px }
.row { display: flex; gap: 18px; flex-wrap: wrap }
.row > .field { flex: 1 1 200px }
.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink) }
.btn.sec { background: var(--sunk); color: var(--ink) }
.btn.small { padding: 6px 10px; font-size: 13px }

/* risultato panchina */
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; padding: 14px 16px; border-radius: var(--r); background: var(--sunk) }
.verdict .big { font-family: var(--f-display); font-weight: 700; font-size: 64px; line-height: .9; color: var(--hot); grid-row: span 2 }
.verdict .k { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-transform: uppercase }
.verdict .s { color: var(--muted); font-size: 13px }
.bars { display: grid; gap: 5px }
.bar { display: grid; grid-template-columns: 34px 1fr 52px; gap: 8px; align-items: center; font-size: 14px }
.bar .t { height: 20px; background: var(--sunk); border-radius: 4px; overflow: hidden; position: relative }
.bar .t i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px }
.bar.best .t i { background: var(--hot) }
.bar .t .mid { position: absolute; top: -2px; bottom: -2px; left: 50%; border-left: 1px dashed var(--muted); opacity: .6 }
.bar b { font-family: var(--f-display); font-size: 18px }
.bar .v { text-align: right }
.log { display: grid; gap: 4px; font-size: 13px }
.log div { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 8px; background: var(--bg); border-radius: 6px }
.endset { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 12px }

/* tabelle */
.tbl-wrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600 }
td.r, th.r { text-align: right }
.pct { display: inline-flex; align-items: center; gap: 6px }
.pct s { text-decoration: none; display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); opacity: .75 }
.n { color: var(--muted); font-size: 12px }
.tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--sunk) }
.tag.w { background: color-mix(in oklab, var(--good) 18%, var(--surface)); color: var(--good) }
.tag.l { background: color-mix(in oklab, var(--bad) 16%, var(--surface)); color: var(--bad) }
.hi { color: var(--good); font-weight: 600 } .lo { color: var(--bad); font-weight: 600 }

/* heatmap */
.heat { display: grid; grid-template-columns: 54px repeat(6, minmax(40px, 1fr)); gap: 3px; min-width: 330px }
.heat .h { font-size: 11px; color: var(--muted); text-align: center; align-self: end; padding-bottom: 2px; font-weight: 600 }
.heat .rh { font-family: var(--f-display); font-weight: 700; font-size: 17px; align-self: center }
.heat button { border: 0; border-radius: 5px; padding: 10px 0; font-family: var(--f-mono); font-size: 14px; color: var(--ink) }
.heat button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px }
.legend { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap }
.legend i { width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, color-mix(in oklab, var(--bad) 70%, var(--surface)), var(--sunk), color-mix(in oklab, var(--good) 70%, var(--surface))) }
.phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 10px }
.ph { padding: 7px 9px; background: var(--bg); border-radius: 6px; font-size: 13px; display: grid; gap: 2px }
.ph b { font-family: var(--f-display); font-size: 16px }

.findings { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.findings li { padding: 10px 12px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--accent) }
.findings li.strong { border-left-color: var(--hot) }
.findings b { font-weight: 600 }

.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; display: grid; gap: 8px; justify-items: center }
.drop.over { border-color: var(--accent); background: var(--sunk) }
.matches { display: grid; gap: 6px }
.match { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--bg); border-radius: 8px; flex-wrap: wrap }
.match .t { flex: 1 1 220px; min-width: 0 }
.warn { padding: 10px 12px; border-radius: 8px; background: color-mix(in oklab, var(--hot) 14%, var(--surface)); font-size: 13px }
.empty { color: var(--muted); padding: 10px 0 }
/* rete */
.nets { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); margin-top: 10px }
.phn { background: var(--bg); border-radius: 8px; padding: 10px; display: grid; gap: 8px; min-width: 0 }
.phh { display: flex; justify-content: space-between; gap: 8px; font-size: 14px }
.phh b { font-family: var(--f-display); font-size: 17px; font-weight: 700 }
.net { display: grid; gap: 4px }
.netrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px }
.netline { position: relative; height: 10px }
.netline::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dotted var(--muted) }
.netline span { position: absolute; left: 50%; transform: translate(-50%, -2px); background: var(--bg); padding: 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
.pl { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 6px; padding: 5px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); min-width: 0; font-size: 12.5px; line-height: 1.25 }
.pl.us { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)) }
.pl.them { border-color: color-mix(in oklab, var(--hot) 45%, var(--line)) }
.pl.set { opacity: .7 }
.pl .rl { grid-row: span 2; align-self: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk) }
.pl.us .rl { color: var(--accent) } .pl.them .rl { color: var(--hot) }
.pl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pl .ef { font-size: 12px }
.netfoot { display: grid; gap: 2px; font-size: 12px; color: var(--muted); margin-top: 4px }
.netfoot b { color: var(--ink) }
details.panel > summary { cursor: pointer; list-style-position: outside; margin-left: 18px }
/* piano di battuta */
.plan { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)) }
.pc { background: var(--bg); border-radius: 8px; padding: 12px; display: grid; gap: 8px; min-width: 0; align-content: start }
.pch { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.pch b { font-family: var(--f-display); font-size: 18px; font-weight: 700; text-transform: uppercase }
.srv { font-size: 14px }
.pcb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start }
.tg-list { display: grid; gap: 6px; font-size: 14px; min-width: 0 }
.risk { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em }
.risk.push { background: var(--hot); color: #fff }
.risk.safe { background: color-mix(in oklab, var(--good) 22%, var(--surface)); color: var(--good) }
.risk.aim { background: var(--sunk); color: var(--ink) }
.court { display: grid; grid-template-columns: repeat(3, 34px); gap: 2px; position: relative; padding-bottom: 14px }
.cz { height: 34px; border-radius: 4px; display: grid; place-items: center; align-content: center; font-size: 10px; line-height: 1.1 }
.cz b { font-size: 12px } .cz i { font-style: normal; font-size: 9.5px }
.cz.tg { outline: 2px solid var(--ink); outline-offset: -2px }
.cnet { position: absolute; left: 0; right: 0; bottom: 0; border-top: 2px dotted var(--muted); font-size: 9px; text-align: center; color: var(--muted); text-transform: uppercase; letter-spacing: .1em }
/* alzata */
.setl { font-size: 13px }
.setgrid { display: grid; gap: 18px; grid-template-columns: auto minmax(0, 400px) minmax(0, 1fr); align-items: start }
.landpick { display: grid; gap: 8px; justify-items: start; max-width: 200px }
.court.big { grid-template-columns: repeat(3, 56px) }
.court.big .cz { height: 50px; border: 1px solid var(--line); background: var(--bg); color: var(--ink) }
.court.big .cz b { font-size: 15px } .court.big .cz i { font-size: 10px; color: var(--muted) }
.court.big .cz[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.court.big .cz[aria-pressed="true"] i { color: inherit }
@media (max-width: 900px) { .setgrid { grid-template-columns: minmax(0, 1fr) } .landpick { max-width: none } }
.setcourt { display: grid; gap: 4px }
.szrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px }
.sz { border-radius: 8px; padding: 8px; display: grid; gap: 1px; min-height: 92px; align-content: start; background: color-mix(in oklab, var(--hot) var(--a), var(--sunk)); min-width: 0 }
.sz.top { outline: 2px solid var(--hot); outline-offset: -2px }
.sz b { font-family: var(--f-display); font-size: 26px; line-height: 1 }
.szl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
.szw { font-size: 12.5px; overflow-wrap: anywhere }
.setinfo { display: grid; gap: 8px; font-size: 14px }
.jump { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin }
.jump .chip { white-space: nowrap; flex: none }
[id^="st-"], details.panel { scroll-margin-top: 170px }
/* panchina: pulsanti grandi */
.stage h2 { margin-bottom: 8px }
.brow { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end }
.brow.wrap { gap: 14px 28px }
.bfield { display: grid; gap: 6px }
.bchip { min-width: 64px; min-height: 56px; padding: 0 18px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 700; font-family: var(--f-display); letter-spacing: .02em }
.bchip.sm { min-height: 44px; min-width: 52px; font-size: 16px; padding: 0 12px }
.bchip.xl { min-width: 140px; min-height: 72px; font-size: 26px }
.bchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.bchip.hot[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff }
.bchip:disabled { opacity: .4 }
.pgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px }
.pgrid .bchip { min-width: 0; padding: 0 }
.ask { font-size: 26px }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px }
.steps span { padding: 6px 12px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-weight: 600; font-size: 13px }
.steps span.on { background: var(--ink); color: var(--bg) }
.duo { display: grid; gap: 12px 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); align-items: start }
.tcol { display: grid; gap: 12px; align-content: start; min-width: 0 }
.tcard { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0 }
.tcard.rec, .tcard.pred { background: var(--sunk); border-color: transparent }
.tcard.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent) }
.tcard.real.active { border-color: var(--hot); box-shadow: 0 0 0 3px color-mix(in oklab, var(--hot) 22%, transparent) }
.tlbl { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase }
.tcard.rec .tlbl, .tcard.pick .tlbl { color: var(--accent) }
.tcard.pred .tlbl, .tcard.real .tlbl { color: var(--hot) }
.tbig { display: flex; gap: 14px; align-items: center }
.tbig > b { font-family: var(--f-display); font-size: 58px; line-height: .9; color: var(--accent) }
.tbig > b.hot, .tcard.pred .tbig > b { color: var(--hot) }
.tbig span { font-size: 15px }
.sheet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px }
.sc { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; grid-template-columns: auto 1fr; column-gap: 6px; align-items: center; background: var(--surface); min-width: 0 }
.sc.us { border-color: color-mix(in oklab, var(--accent) 40%, var(--line)) }
.sc.them { border-color: color-mix(in oklab, var(--hot) 40%, var(--line)) }
.sc .rn { grid-row: span 2; font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--muted); min-width: 22px }
.sc b { font-size: 17px }
.sc .sn { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.sc > * { min-width: 0 }
.sheet.edit .sc { grid-template-columns: auto minmax(0, 1fr) }
.psel { font-size: 14px; padding: 6px; width: 100% }
.bar-actions { display: flex; gap: 10px; flex-wrap: wrap }
.bigbtn { flex: 1 1 240px; min-height: 64px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: .03em; text-transform: uppercase }
.bigbtn.sec { background: var(--sunk); color: var(--ink); min-height: 52px; font-size: 18px; flex: 0 1 auto; padding: 0 22px }
.bigbtn:disabled { opacity: .4 }
.matchhead { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: baseline }
.matchhead > b { font-family: var(--f-display); font-size: 30px }
.matchhead b.num { font-size: 22px; color: var(--hot) }
.phl { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px }
.phl div { display: grid; grid-template-columns: auto 1fr auto; column-gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--bg); font-size: 14px }
.phl div .n:nth-child(3) { grid-column: 2; font-size: 12px }
.phl div > :last-child { grid-row: 1 / span 2; grid-column: 3; font-size: 16px }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 12px }
.side { border-radius: 14px; padding: 12px; background: var(--sunk); display: grid; justify-items: center; gap: 2px; border: 3px solid transparent }
.side.srv { border-color: var(--accent) }
.side.them.srv { border-color: var(--hot) }
.side .tn { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center }
.side b { font-family: var(--f-display); font-size: 64px; line-height: 1 }
.side .rot { font-weight: 700 }
.ptbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.ptbtn { min-height: 96px; border: 0; border-radius: 16px; font-family: var(--f-display); font-weight: 700; font-size: 30px; text-transform: uppercase; color: #fff }
.ptbtn.us { background: var(--accent); color: var(--accent-ink) }
.ptbtn.them { background: var(--hot) }
.ptbtn:active { transform: scale(.98) }
.lang { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 6px 4px }
@media (max-width: 520px) { .verdict .big { font-size: 52px } .brand { font-size: 21px } nav.tabs { width: 100% } nav.tabs button { flex: 1 } }
@media (prefers-reduced-motion: no-preference) { .bar .t i { transition: width .25s ease } }
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Rotation <b>Matchup</b></div>
    <div class="teams">
      <label for="selMy"><span class="lbl">Us</span><select id="selMy"></select></label>
      <span class="vs">VS</span>
      <label for="selOpp"><span class="lbl">Opponent</span><select id="selOpp"></select></label>
    </div>
    <a class="lang" href="index.html" hreflang="it">Italiano</a>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-bench" aria-selected="true" data-tab="bench">Bench</button>
      <button role="tab" id="tab-study" aria-selected="false" data-tab="study">Study</button>

<div class="wrap"><main id="main"></main></div>

<script>
// ===== Rotazioni: core (parser .dvw + statistiche + simulazione + previsione) =====
const RC = (() => {
  const nextRot = r => (r === 1 ? 6 : r - 1); // ordine DataVolley: P1 -> P6 -> P5 ...

  function normName(s) {
    return (s || '').toUpperCase().replace(/\(.*?\)/g, ' ').replace(/[^A-Z0-9 ]/g, ' ')
      .replace(/\b(VC|V C|WOMEN|W|FC|BC)\b/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function section(lines, name) {
    const i = lines.findIndex(l => l.trim().toUpperCase() === '[3' + name + ']');
    if (i < 0) return [];
    const out = [];
    for (let j = i + 1; j < lines.length && !/^\[3/.test(lines[j]); j++) out.push(lines[j]);
    return out;
  }

  function parseDVW(text, fileName) {
    const lines = text.replace(/\r/g, '').split('\n');
    const match = section(lines, 'MATCH');
    const teamsL = section(lines, 'TEAMS').filter(l => l.trim());
    if (teamsL.length < 2) throw new Error('Teams section not found');
    const mf = (match[0] || '').split(';');
    const tf = teamsL.map(l => l.split(';'));
    const teams = [0, 1].map(i => ({
      code: (tf[i][0] || '').trim(), name: (tf[i][1] || '').trim(),
      coach: (tf[i][3] || '').trim(), key: normName(tf[i][1])
    }));
    // giocatrici: ruolo DataVolley 1 libero, 2 schiacciatrice, 3 opposto, 4 centrale, 5 palleggiatrice
    const players = [section(lines, 'PLAYERS-H'), section(lines, 'PLAYERS-V')].map(arr => {
      const out = {};
      arr.forEach(l => {
        const f = l.split(';'); if (f.length < 14 || f[1] === '' || isNaN(+f[1])) return;
        const last = (f[9] || '').trim(), first = (f[10] || '').trim();
        out[+f[1]] = { last, first, role: (f[12] || '').trim() === 'L' ? 1 : (+f[13] || 0) };
      });
      return out;
    });
    const pstats = [{}, {}];
    const ps = (side, n) => (pstats[side][n] = pstats[side][n] || { aN: 0, aK: 0, aE: 0, aB: 0, sN: 0, sA: 0, sE: 0, bK: 0, rN: 0, rG: 0, rE: 0 });
    const lineups = [{}, {}]; // lineups[side][rot]["z1,z2,...,z6"] = rally

    const scout = section(lines, 'SCOUT');
    const sets = {};
    let lastWinner = null, curSet = 0, pendingServer = null, setter = [null, null], srv = null, rec = null, waitAtt = -1, att = null;
    const getSet = n => (sets[n] = sets[n] || { n, rallies: [], start: null, firstServe: null, lineup: null, setters: [null, null] });

    for (const raw of scout) {
      if (!raw.trim()) continue;
      const f = raw.split(';');
      const code = f[0];
      const setN = parseInt(f[8], 10);
      if (/^\*\*\dset/i.test(code)) { lastWinner = null; pendingServer = null; continue; }
      const side = code[0] === '*' ? 0 : code[0] === 'a' ? 1 : -1;
      if (side < 0) continue;
      const pm = code.match(/^[*a]P(\d+)/);
      if (pm) { setter[side] = +pm[1]; continue; }
      if (!setN) continue;
      if (setN !== curSet) { curSet = setN; lastWinner = null; pendingServer = null; }
      const s = getSet(setN);
      if (!s.setters[side] && setter[side] != null) s.setters[side] = setter[side];
      const rz = [parseInt(f[9], 10), parseInt(f[10], 10)];
      const sk = code.match(/^[*a](\d\d)([SREABDF])[A-Z~]?([#+!\-\/=])?/);
      if (sk) {
        const st = ps(side, +sk[1]), ev = sk[3];
        if (sk[2] === 'A') { st.aN++; if (ev === '#') st.aK++; else if (ev === '=') st.aE++; else if (ev === '/') st.aB++; }
        else if (sk[2] === 'S') { st.sN++; if (ev === '#') st.sA++; else if (ev === '=') st.sE++; }
        else if (sk[2] === 'B') { if (ev === '#') st.bK++; }
        else if (sk[2] === 'R') { st.rN++; if (ev === '#' || ev === '+') st.rG++; else if (ev === '=') st.rE++; }
      }
      if (waitAtt >= 0 && /^[*a](\d\d|\$\$)[A-Z]/.test(code) && !/^[*a]\d\dR/.test(code)) {
        if (side !== waitAtt) waitAtt = -1;
        else if (code[3] === 'A') {
          const fz = parseInt(code[9], 10);
          att = { num: +code.slice(1, 3), from: fz >= 1 && fz <= 9 ? fz : 0, ev: code[5] || '', combo: code.slice(6, 8).replace(/~/g, '') };
          waitAtt = -1;
        }
      }
      if (/^[*a]\d\dR/.test(code)) {
        const ez = parseInt(code[10], 10);
        rec = { num: +code.slice(1, 3), ev: code[5] || '', ez: ez >= 1 && ez <= 9 ? ez : 0 };
        waitAtt = side;
        if (srv && !srv.ez) srv.ez = rec.ez;
      }
      if (/^[*a](\d\d|\$\$)S/.test(code)) {
        pendingServer = side;
        { const num = code.slice(1, 3) === '$$' ? -1 : +code.slice(1, 3), ez = parseInt(code[10], 10);
          const sz = parseInt(code[9], 10);
          srv = { num, type: code[4] || '', ev: code[5] || '', ez: ez >= 1 && ez <= 9 ? ez : 0, sz: sz >= 1 && sz <= 9 ? sz : 0 }; rec = null; att = null; waitAtt = -1; }
        if (!s.start && rz[0] >= 1 && rz[0] <= 6 && rz[1] >= 1 && rz[1] <= 6) {
          s.start = rz.slice(); s.firstServe = side;
          s.lineup = [f.slice(14, 20).map(Number), f.slice(20, 26).map(Number)];
        }
        continue;
      }
      const pt = code.match(/^[*a]p(\d+):(\d+)/);
      if (pt) {
        const winner = side;
        let server = pendingServer != null ? pendingServer : lastWinner;
        if (!(rz[0] >= 1 && rz[0] <= 6 && rz[1] >= 1 && rz[1] <= 6)) { lastWinner = winner; pendingServer = null; continue; }
        if (!s.start) { s.start = rz.slice(); s.firstServe = server; s.lineup = [f.slice(14, 20).map(Number), f.slice(20, 26).map(Number)]; }
        if (server != null) s.rallies.push(srv && pendingServer === server ? [server, winner, rz[0], rz[1], srv.num, srv.type, srv.ev, srv.ez, rec ? rec.num : -1, rec ? rec.ev : '', srv.sz, att ? att.num : -1, att ? att.from : 0, att ? att.ev : '', att ? att.combo : ''] : [server, winner, rz[0], rz[1]]);
        [0, 1].forEach(sd => {
          const z = f.slice(14 + sd * 6, 20 + sd * 6).map(x => parseInt(x, 10));
          if (z.some(isNaN)) return;
          const L = (lineups[sd][rz[sd]] = lineups[sd][rz[sd]] || {}); const k = z.join(',');
          L[k] = (L[k] || 0) + 1;
        });
        s.final = [+pt[1], +pt[2]];
        lastWinner = winner; pendingServer = null; srv = null; rec = null; att = null; waitAtt = -1;
      }
    }

    const setList = Object.values(sets).filter(s => s.start && s.rallies.length).sort((a, b) => a.n - b.n);
    setList.forEach(s => {
      const [a, b] = s.final;
      const target = s.n === 5 ? 15 : 25;
      s.complete = Math.max(a, b) >= target && Math.abs(a - b) >= 2;
      s.winner = s.complete ? (a > b ? 0 : 1) : null;
      if (s.firstServe == null) s.firstServe = s.rallies[0] ? s.rallies[0][0] : null;
      delete s.lineup;
    });
    return {
      id: teams.map(t => t.key).join('-') + '|' + (mf[0] || '').trim() + '|' + setList.map(s => s.final.join('-')).join(','), file: fileName, date: (mf[0] || '').trim(), season: (mf[2] || '').trim(),
      competition: (mf[3] || '').trim(), teams, sets: setList, players, pstats, lineups
    };
  }

  // ---------- giocatrici ----------
  function teamPlayers(matches, key) {
    const out = {};
    matches.forEach(m => {
      const side = m.teams.findIndex(t => t.key === key); if (side < 0 || !m.players) return;
      Object.entries(m.players[side]).forEach(([n, p]) => { out[n] = out[n] || { num: +n, ...p, aN: 0, aK: 0, aE: 0, aB: 0, sN: 0, sA: 0, sE: 0, bK: 0, rN: 0, rG: 0, rE: 0, matches: 0 }; Object.assign(out[n], { last: p.last, first: p.first, role: p.role || out[n].role }); });
      Object.entries((m.pstats || [])[side] || {}).forEach(([n, s]) => {
        const o = out[n] = out[n] || { num: +n, last: '#' + n, first: '', role: 0, aN: 0, aK: 0, aE: 0, aB: 0, sN: 0, sA: 0, sE: 0, bK: 0, rN: 0, rG: 0, rE: 0, matches: 0 };
        for (const k in s) o[k] += s[k]; o.matches++;
      });
    });
    Object.values(out).forEach(p => { p.eff = p.aN ? (p.aK - p.aE - p.aB) / p.aN : null; p.kill = p.aN ? p.aK / p.aN : null; });
    return out;
  }

  // ---------- battuta / ricezione ----------
  const POS = e => e === '#' || e === '+';
  // le nostre battitrici
  function serverStats(matches, key) {
    const out = {}; const byRot = {}; for (let r = 1; r <= 6; r++) byRot[r] = {};
    matches.forEach(m => {
      const side = m.teams.findIndex(t => t.key === key); if (side < 0) return;
      m.sets.forEach(s => s.rallies.forEach(ra => {
        if (ra[0] !== side || ra.length < 5 || ra[4] < 0) return;
        const n = ra[4], o = out[n] = out[n] || { num: n, n: 0, won: 0, ace: 0, err: 0, rec: 0, recPos: 0, types: {}, zones: {}, from: {} };
        const fgz = fromGroup(ra[10]); if (fgz) o.from[fgz] = (o.from[fgz] || 0) + 1;
        o.n++; if (ra[1] === side) o.won++;
        if (ra[6] === '#') o.ace++; if (ra[6] === '=') o.err++;
        if (ra[5]) o.types[ra[5]] = (o.types[ra[5]] || 0) + 1;
        if (ra[7]) o.zones[ra[7]] = (o.zones[ra[7]] || 0) + 1;
        if (ra[8] >= 0 && ra[9]) { o.rec++; if (POS(ra[9])) o.recPos++; }
        const rr = byRot[ra[2 + side]]; rr[n] = (rr[n] || 0) + 1;
      }));
    });
    const servers = {}; for (let r = 1; r <= 6; r++) { const e = Object.entries(byRot[r]).sort((a, b) => b[1] - a[1]); servers[r] = e.length ? +e[0][0] : null; }
    return { players: out, byRot: servers };
  }
  // la loro ricezione, per rotazione e per giocatrice
  function receptionStats(matches, key) {
    const mk = () => ({ n: 0, so: 0, pos: 0, perf: 0, err: 0 });
    const rot = {}; for (let r = 1; r <= 6; r++) rot[r] = { all: mk(), rcv: {}, zones: {}, rcvZone: {} };
    const players = {}, zones = {}, all = mk();
    const add = (o, ra, side) => { o.n++; if (ra[1] === side) o.so++; if (ra[9] === '#') o.perf++; if (POS(ra[9])) o.pos++; if (ra[9] === '=') o.err++; };
    matches.forEach(m => {
      const side = m.teams.findIndex(t => t.key === key); if (side < 0) return;
      m.sets.forEach(s => s.rallies.forEach(ra => {
        if (ra[0] === side || ra.length < 5) return;
        const R = rot[ra[2 + side]];
        if (ra[6] === '=') return; // errore in battuta: nessuna ricezione
        add(R.all, ra, side); add(all, ra, side);
        if (ra[7]) { add(R.zones[ra[7]] = R.zones[ra[7]] || mk(), ra, side); add(zones[ra[7]] = zones[ra[7]] || mk(), ra, side); }
        if (ra[8] >= 0) {
          add(R.rcv[ra[8]] = R.rcv[ra[8]] || mk(), ra, side); add(players[ra[8]] = players[ra[8]] || mk(), ra, side);
          if (ra[7]) { const z = R.rcvZone[ra[8]] = R.rcvZone[ra[8]] || {}; z[ra[7]] = (z[ra[7]] || 0) + 1; }
        }
      }));
    });
    return { rot, players, zones, all };
  }
  // piano di battuta per una rotazione avversaria in ricezione
  function serveTarget(rs, b, K = 8) {
    const R = rs.rot[b], base = rs.all.n ? rs.all.so / rs.all.n : 0.6;
    const pso = (loc, glob) => { const g = glob && glob.n ? (glob.so + K * base) / (glob.n + K) : base; return (loc.so + K * g) / (loc.n + K); };
    const rcv = Object.entries(R.rcv).filter(([, o]) => o.n >= Math.max(2, R.all.n * 0.12)).map(([num, o]) => {
      const zc = R.rcvZone[num] || {}; const zm = Object.entries(zc).sort((a, b) => b[1] - a[1])[0];
      return { num: +num, n: o.n, share: o.n / Math.max(1, R.all.n), so: pso(o, rs.players[num]), raw: o, glob: rs.players[num], zone: zm ? +zm[0] : null };
    }).sort((x, y) => x.so - y.so);
    const zones = Object.entries(R.zones).map(([z, o]) => ({ z: +z, n: o.n, so: pso(o, rs.zones[z]) })).sort((x, y) => x.so - y.so);
    return { n: R.all.n, so: R.all.n ? R.all.so / R.all.n : null, pos: R.all.n ? R.all.pos / R.all.n : null, rcv, zones, zoneMap: Object.fromEntries(zones.map(z => [z.z, z])) };
  }

  // ---------- distribuzione dell'alzata dopo ricezione ----------
  const SETZ = ['4', '3', '2', 'P', '1', '5', 'D'];
  const setGroup = (z, role) => role === 5 ? 'D' : z === 4 ? '4' : z === 3 ? '3' : z === 2 ? '2' : z === 8 ? 'P' : (z === 9 || z === 1) ? '1' : (z === 7 || z === 5 || z === 6) ? '5' : null;
  const fromGroup = z => (z === 1 || z === 9) ? '1' : z === 6 ? '6' : (z === 5 || z === 7) ? '5' : null;
  const qGroup = e => (e === '#' || e === '+') ? 'pos' : e === '!' ? 'mid' : (e === '-' || e === '/') ? 'neg' : null;
  const laneOf = z => [1, 9, 2].includes(z) ? '1' : [6, 8, 3].includes(z) ? '6' : [5, 7, 4].includes(z) ? '5' : null;
  function setStats(matches, key) {
    const mk = () => ({ n: 0, c: {} });
    const rot = {}; for (let r = 1; r <= 6; r++) rot[r] = { all: mk(), cell: {}, who: {}, land: {} };
    const team = mk();
    matches.forEach(m => {
      const side = m.teams.findIndex(t => t.key === key); if (side < 0) return;
      const roster = (m.players || [])[side] || {};
      m.sets.forEach(s => s.rallies.forEach(ra => {
        if (ra[0] === side || ra.length < 12 || ra[11] < 0) return;
        const g = setGroup(ra[12], (roster[ra[11]] || {}).role); if (!g) return;
        const R = rot[ra[2 + side]], z = ra[7] || 0, ln = laneOf(z), qg = qGroup(ra[9]);
        const inc = o => { o.n++; o.c[g] = (o.c[g] || 0) + 1; };
        inc(team); inc(R.all);
        if (z) R.land[z] = (R.land[z] || 0) + 1;
        const where = ['*']; if (ln) where.push('l' + ln); if (z) where.push('z' + z);
        const qs = ['*']; if (qg) qs.push(qg);
        where.forEach(w => qs.forEach(q => inc(R.cell[w + '|' + q] = R.cell[w + '|' + q] || mk())));
        const w = (R.who[g] = R.who[g] || {}); const p = (w[ra[11]] = w[ra[11]] || { n: 0, k: 0, e: 0 });
        p.n++; if (ra[13] === '#') p.k++; else if (ra[13] === '=' || ra[13] === '/') p.e++;
      }));
    });
    return { rot, team };
  }
  // distribuzione stimata, dal generale al particolare: rotazione -> qualità -> corsia -> zona di arrivo
  function setDistribution(st, b, zone = 0, qg = '*', K = 6) {
    const norm = (o, prior, k) => { const d = {}; SETZ.forEach(z => d[z] = ((o ? o.c[z] || 0 : 0) + k * prior[z]) / ((o ? o.n : 0) + k)); return d; };
    const flat = {}; SETZ.forEach(z => flat[z] = 1 / SETZ.length);
    const R = st.rot[b];
    let d = norm(R.all, norm(st.team, flat, 2), K), n = R.all.n;
    const chain = []; if (qg !== '*') chain.push('*|' + qg);
    if (zone) { const ln = laneOf(zone); if (ln) chain.push('l' + ln + '|' + qg); chain.push('z' + zone + '|' + qg); }
    chain.forEach(k => { const c = R.cell[k]; d = norm(c, d, K); n = c ? c.n : 0; });
    const who = {}; SETZ.forEach(z => { const e = Object.entries(R.who[z] || {}).sort((x, y) => y[1].n - x[1].n)[0]; if (e) who[z] = { num: +e[0], ...e[1] }; });
    return { d, n, nRot: R.all.n, who, land: R.land };
  }

  // formazione più frequente per ogni rotazione (zone 1..6 -> numero)
  function teamLineups(matches, key) {
    const agg = {}; for (let r = 1; r <= 6; r++) agg[r] = {};
    matches.forEach(m => {
      const side = m.teams.findIndex(t => t.key === key); if (side < 0 || !m.lineups) return;
      for (let r = 1; r <= 6; r++) Object.entries(m.lineups[side][r] || {}).forEach(([k, c]) => { agg[r][k] = (agg[r][k] || 0) + c; });
    });
    const out = {};
    for (let r = 1; r <= 6; r++) {
      const e = Object.entries(agg[r]).sort((a, b) => b[1] - a[1]);
      const tot = e.reduce((s, x) => s + x[1], 0);
      out[r] = e.length ? { zones: e[0][0].split(',').map(Number), share: e[0][1] / tot, n: tot } : null;
    }
    return out;
  }

  // ---------- statistiche per rotazione ----------
  // per la squadra key: SO (ricezione) e BP (battuta) per rotazione 1..6
  function rotStats(matches, key) {
    const r = {}; for (let i = 1; i <= 6; i++) r[i] = { soW: 0, soN: 0, bpW: 0, bpN: 0 };
    let soW = 0, soN = 0, bpW = 0, bpN = 0;
    matches.forEach(m => {
      const side = m.teams.findIndex(t => t.key === key); if (side < 0) return;
      m.sets.forEach(s => s.rallies.forEach(ra => {
        const st = r[ra[2 + side]];
        if (ra[0] === side) { st.bpN++; bpN++; if (ra[1] === side) { st.bpW++; bpW++; } }
        else { st.soN++; soN++; if (ra[1] === side) { st.soW++; soW++; } }
      }));
    });
    return { rot: r, so: soN ? soW / soN : null, bp: bpN ? bpW / bpN : null, soN, bpN };
  }

  // pool di tutti i rally (media "lega") per log5
  function leagueSO(matches) {
    let w = 0, n = 0;
    matches.forEach(m => m.sets.forEach(s => s.rallies.forEach(ra => { n++; if (ra[1] !== ra[0]) w++; })));
    return n ? w / n : 0.6;
  }

  // stima con shrinkage verso la media della squadra
  function shrunk(stats, M = 12) {
    const out = { so: {}, bp: {} };
    for (let i = 1; i <= 6; i++) {
      const s = stats.rot[i];
      out.so[i] = (s.soW + M * stats.so) / (s.soN + M);
      out.bp[i] = (s.bpW + M * stats.bp) / (s.bpN + M);
    }
    return out;
  }

  const log5 = (x, y, L) => { const a = x * y / L, b = (1 - x) * (1 - y) / (1 - L); return a / (a + b); };

  // P(ricevente fa sideout) dati SO ricevente e BP battitore
  function pSideout(soRec, bpSrv, L) { return log5(soRec, 1 - bpSrv, L); }

  // ---------- simulazione set (Monte Carlo, RNG seminato) ----------
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // A = mia squadra, B = avversario. est = {so:{1..6}, bp:{1..6}}
  function buildP(A, B, L) {
    // P[a][b][server] = prob che vinca A il rally
    const P = {};
    for (let a = 1; a <= 6; a++) { P[a] = {}; for (let b = 1; b <= 6; b++) {
      P[a][b] = [1 - pSideout(B.so[b], A.bp[a], L), pSideout(A.so[a], B.bp[b], L)];
    } }
    return P;
  }

  function simSet(P, a0, b0, firstServer, target, n, seed) {
    const R = rng(seed); let wins = 0;
    for (let k = 0; k < n; k++) {
      let a = a0, b = b0, sv = firstServer, sa = 0, sb = 0;
      while (true) {
        const pA = P[a][b][sv];
        if (R() < pA) { if (sv === 1) { a = nextRot(a); sv = 0; } sa++; }
        else { if (sv === 0) { b = nextRot(b); sv = 1; } sb++; }
        if ((sa >= target || sb >= target) && Math.abs(sa - sb) >= 2) break;
      }
      if (sa > sb) wins++;
    }
    return wins / n;
  }

  // matrice 6x6: M[a][b] prob vittoria set per A, con server iniziale (0 = A batte, 1 = B batte)
  function matrix(A, B, L, firstServer, target = 25, n = 4000) {
    const P = buildP(A, B, L); const M = {};
    for (let a = 1; a <= 6; a++) { M[a] = {}; for (let b = 1; b <= 6; b++) M[a][b] = simSet(P, a, b, firstServer, target, n, 1000 + a * 7 + b); }
    return M;
  }

  // ---------- storico partenze di una squadra ----------
  function startHistory(matches, key) {
    const rows = [];
    matches.forEach(m => {
      const side = m.teams.findIndex(t => t.key === key); if (side < 0) return;
      const opp = m.teams[1 - side];
      let prev = null;
      m.sets.forEach(s => {
        const row = {
          match: m.id, date: m.date, opp: opp.name, oppKey: opp.key, set: s.n,
          start: s.start[side], oppStart: s.start[1 - side],
          serveFirst: s.firstServe == null ? null : s.firstServe === side,
          won: s.winner == null ? null : s.winner === side,

// riproduce il set dai punti toccati
function replay(b) {
  let a = b.myPick, o = b.oppReal, sv = b.weServe ? 0 : 1, su = 0, so = 0; const rallies = [];
  if (!a || !o) return { a, o, sv, su, so, rallies };

      else { so++; if (sv === 0) { o = RC.nextRot(o); sv = 1; } }

  }

}
function setSummaryStats(rallies) {

  const us = mk(), th = mk();

    const U = us[x.a], H = th[x.b];

}

      <div class="phl">${ph.map((x, i) => `<div><span class="n num">${i + 1}</span><b>P${x.a}–P${x.b}</b><span class="n">${x.sv === 0 ? T('srvUs') : T('srvThem')}</span><span class="num ${x.p >= 0.5 ? 'hi' : 'lo'}">${pc(x.p)}</span></div>`).join('')}</div>
      <p class="n" style="margin-top:6px">${T('rally')}: ${T('us').toLowerCase()} P – ${T('them').toLowerCase()} P</p></section>`;
    live += counterBlock();
  }
  live += endBlock();
  return head + teams + `<div class="bar-actions"><button class="bigbtn sec" data-bact="edit">${T('edit')}</button></div>` + live + (real ? details(pick, real, M) : '') + logBlock();
}

function counterBlock() {
  const b = S.bench, r = replay(b);
  const n1 = esc(teamName(S.myKey)), n2 = esc(teamName(S.oppKey));
  const target = b.set === 5 ? 15 : 25;
  const over = (r.su >= target || r.so >= target) && Math.abs(r.su - r.so) >= 2;
  return `<section class="panel counter">
    <h3>${T('counter')}</h3>
    <div class="score">
      <div class="side${r.sv === 0 ? ' srv' : ''}"><span class="tn">${n1}</span><b class="num">${r.su}</b><span class="rot">P${r.a}${r.sv === 0 ? ` · ${T('serving')}` : ''}</span></div>
      <div class="side them${r.sv === 1 ? ' srv' : ''}"><span class="tn">${n2}</span><b class="num">${r.so}</b><span class="rot">P${r.o}${r.sv === 1 ? ` · ${T('serving')}` : ''}</span></div>
    </div>
    <div class="ptbtns"><button class="ptbtn us" data-bact="pt" data-v="U">${T('pointUs')}</button><button class="ptbtn them" data-bact="pt" data-v="T">${T('pointThem')}</button></div>
    <div class="brow wrap" style="margin-top:10px"><button class="bchip sm" data-bact="undo"${b.points.length ? '' : ' disabled'}>${T('undo')}</button><button class="bchip sm" data-bact="fixtoggle" aria-pressed="${String(!!S.fixOpen)}">${T('fix')}</button></div>
    ${S.fixOpen ? `<div class="brow wrap" style="margin-top:10px">
      <div class="bfield"><span class="lbl">${T('nowUs')}</span><div class="brow">${[1, 2, 3, 4, 5, 6].map(i => bigChip('bfixmy', i, r.a, 'P' + i, 'sm')).join('')}</div></div>
      <div class="bfield"><span class="lbl">${T('nowThem')}</span><div class="brow">${[1, 2, 3, 4, 5, 6].map(i => bigChip('bfixop', i, r.o, 'P' + i, 'sm')).join('')}</div></div></div>` : ''}
    ${over ? `<p class="warn" style="margin-top:10px">${T('endLooks', r.su > r.so ? T('us') : T('them'))}</p>` : ''}
    <p class="n" style="margin-top:8px">${T('counterNote')}</p>
  </section>`;
}

function endBlock() {
  const b = S.bench, r = replay(b);
  const target = b.set === 5 ? 15 : 25;
  const auto = (r.su >= target || r.so >= target) && Math.abs(r.su - r.so) >= 2 ? (r.su > r.so ? 'noi' : 'loro') : null;
  const w = b.endWin || auto;
  return `<section class="panel stage"><h2>${T('step3')} ${b.set}</h2>
    <div class="bfield"><span class="lbl">${T('wonBy')}</span><div class="brow">${bigChip('bwin', 'noi', w, T('us'), 'xl')}${bigChip('bwin', 'loro', w, T('them'), 'xl')}</div></div>
    <div class="bar-actions"><button class="bigbtn" data-bact="save"${w && b.oppReal ? '' : ' disabled'}>${T('save')}</button></div>
    ${!b.oppReal ? `<p class="n">${T('realPrompt')}</p>` : ''}
  </section>`;
}

function summaryBlock() {
  const b = S.bench, l = b.log[b.log.length - 1];
  if (!l) return '';
  const nextN = Math.min(5, l.set + 1);
  let body = `<p>${T('followed', l.myStart === l.recommended, l.recommended)}</p>`;
  if (l.points && l.points.length) {
    const r = replay({ myPick: l.myStart, oppReal: l.oppStart, weServe: !l.oppServe, points: l.points });
    const st = setSummaryStats(r.rallies);
    const eA = baseEst(S.myKey) || { so: {}, bp: {} }, eB = baseEst(S.oppKey) || { so: {}, bp: {} };
    const bal = [1, 2, 3, 4, 5, 6].filter(x => st.us[x].soN + st.us[x].bpN).map(x => ({ x, v: st.us[x].pf - st.us[x].pa })).sort((p, q) => q.v - p.v);
    if (bal.length) {
      const hi = bal[0], lo = bal[bal.length - 1], sg = v => (v > 0 ? '+' : '') + v;
      const parts = [];
      if (hi.v > 0) parts.push(`<span class="tag w">${T('strong')}</span> P${hi.x} (${sg(hi.v)})`);
      if (lo.v < hi.v && lo.v <= 0) parts.push(`<span class="tag l">${T('weak')}</span> P${lo.x} (${sg(lo.v)})`);
      if (parts.length) body += `<p>${parts.join(' &nbsp; ')}</p>`;
    }
    body += `<section class="grid2" style="margin-top:12px">${summaryTable(st.us, eA, `${T('sumUs')} · ${esc(teamName(S.myKey))}`, false)}${summaryTable(st.th, eB, `${T('sumThem')} · ${esc(teamName(S.oppKey))}`, false)}</section><p class="n">${T('sumNote')}</p>`;
  } else body += `<p class="n">${T('noPoints')}</p>`;
  return `<section class="panel stage"><h2>${T('summary', l.set)} <span class="tag ${l.oppWon ? 'l' : 'w'}">${l.oppWon ? T('lost') : T('won')}${l.score ? ' ' + l.score : ''}</span></h2>${body}
    <div class="bar-actions">${l.set < 5 ? `<button class="bigbtn" data-bact="next">${T('next', nextN)}</button>` : ''}<button class="bigbtn sec" data-bact="newmatch">${T('newMatch')}</button></div></section>`;
}

function logBlock() {
  const b = S.bench; if (!b.log.length) return '';
  return `<section class="panel"><h3>${T('log')}</h3><div class="log">${b.log.map(l => `<div><b>${T('set')} ${l.set}</b><span>${T('us')} P${l.myStart}</span><span>${T('them')} P${l.oppStart}</span>${l.score ? `<span class="num">${l.score}</span>` : ''}<span class="tag ${l.oppWon ? 'l' : 'w'}">${l.oppWon ? T('lost') : T('won')}</span></div>`).join('')}</div>
    ${b.phase !== 'summary' ? `<div style="margin-top:10px"><button class="bchip sm" data-bact="newmatch">${T('newMatch')}</button></div>` : ''}</section>`;
}

function playersBlock(pick, oppRot) {
  const b = S.bench, base = people(true);
  const sel = (team, side, idx, cur) => `<select class="psel" data-bpl="${side}" data-i="${idx}">${Object.values(team.P).filter(p => p.role !== 1).sort((x, y) => x.num - y.num).map(p => `<option value="${p.num}"${p.num === cur ? ' selected' : ''}>${p.num} ${esc(p.last)}</option>`).join('')}</select>`;
  const grid = (team, side, r) => {
    const z = (b.ovr && b.ovr[side] && b.ovr[side + 'Rot'] === r) ? b.ovr[side] : (team.L[r] ? team.L[r].zones : null);
    if (!z) return '';
    return `<div class="sheet edit">${[3, 2, 1, 4, 5, 0].map(i => `<div class="sc ${side === 'my' ? 'us' : 'them'}"><span class="rn">${ROMAN[i]}</span>${sel(team, side, i, z[i])}</div>`).join('')}</div>`;
  };
  return `<details class="panel" id="benchPlayers"${S.playersOpen ? ' open' : ''}><summary><h2 style="display:inline">${T('players')}</h2></summary>
    <p class="n" style="margin:8px 0">${T('playersNote')}</p>
    <div class="grid2"><div><h3>${T('ourTeam')} · P${pick}</h3>${grid(base.my, 'my', pick)}</div><div><h3>${T('theirTeam')} · P${oppRot}</h3>${grid(base.opp, 'opp', oppRot)}</div></div>
    ${b.ovr && (b.ovr.my || b.ovr.opp) ? `<div style="margin-top:10px"><button class="bchip sm" data-bact="ovrreset">${T('reset')}</button></div>` : ''}
  </details>`;
}

function details(pick, oppRot, M) {
  return playersBlock(pick, oppRot) + `
  <details class="panel" id="benchPlan"${S.planOpen ? ' open' : ''}><summary><h2 style="display:inline">${T('plan')}</h2> <span class="n">P${pick} – P${oppRot}</span></summary>${servePlan(pick, oppRot, S.bench.weServe ? 0 : 1)}</details>
  <details class="panel" id="benchSet"${S.setOpen ? ' open' : ''}><summary><h2 style="display:inline">${T('setDist')}</h2> <span class="n">P${S.srot}</span></summary>${setSection()}</details>
  <details class="panel" id="benchNets"${S.netsOpen ? ' open' : ''}><summary><h2 style="display:inline">${T('nets')}</h2> <span class="n">P${pick} – P${oppRot}</span></summary>${phaseNets(pick, oppRot, S.bench.weServe ? 0 : 1, M)}</details>`;
}

function benchClick(d, t) {
  const b = S.bench;
  if (d.bset) { const n = +d.bset; if (n !== b.set) { b.set = n; b.phase = 'sheet'; b.myPick = null; b.oppReal = null; b.points = []; b.endWin = null; b.ovr = null; if (n === 5) b.weServe = null; } return true; }
  if (d.bserve != null) { b.weServe = d.bserve === '1'; return true; }
  if (d.bprev) { b.prevOppStart = +d.bprev; return true; }
  if (d.bpwon != null) { b.prevOppWon = d.bpwon === '1'; return true; }
  if (d.bpick) { b.myPick = +d.bpick; b.ovr = b.ovr ? { ...b.ovr, my: null } : null; return true; }
  if (d.breal) { b.oppReal = +d.breal; b.ovr = b.ovr ? { ...b.ovr, opp: null } : null; S.srot = b.oppReal; return true; }
  if (d.bwin) { b.endWin = d.bwin; return true; }
  if (d.bfixmy) { b.points.push({ fix: 'my', to: +d.bfixmy }); return true; }
  if (d.bfixop) { b.points.push({ fix: 'op', to: +d.bfixop }); return true; }
  const act = d.bact; if (!act) return false;
  if (act === 'confirm') { b.myPick = +d.v; b.recommended = +d.rec; b.phase = 'live'; window.scrollTo({ top: 0 }); }
  else if (act === 'edit') { b.phase = 'sheet'; }
  else if (act === 'pt') { b.points.push(d.v); }
  else if (act === 'undo') { b.points.pop(); }
  else if (act === 'fixtoggle') { S.fixOpen = !S.fixOpen; }
  else if (act === 'ovrreset') { b.ovr = null; }
  else if (act === 'save') {
    const r = replay(b), target = b.set === 5 ? 15 : 25;
    const auto = (r.su >= target || r.so >= target) && Math.abs(r.su - r.so) >= 2 ? (r.su > r.so ? 'noi' : 'loro') : null;
    const w = b.endWin || auto; if (!w || !b.oppReal) return true;
    const rec = b.recommended || b.myPick;
    b.log = b.log.filter(l => l.set !== b.set).concat([{ set: b.set, myStart: b.myPick, oppStart: b.oppReal, oppServe: !b.weServe, oppWon: w === 'loro', points: b.points.slice(), recommended: rec, score: b.points.some(e => e === 'U' || e === 'T') ? `${r.su}-${r.so}` : '' }]).sort((x, y) => x.set - y.set);
    b.phase = 'summary'; invalidate(); window.scrollTo({ top: 0 });
  }
  else if (act === 'next') {
    const last = b.log[b.log.length - 1];
    b.set = Math.min(5, last.set + 1); b.phase = 'sheet'; b.myPick = null; b.oppReal = null; b.points = []; b.endWin = null; b.ovr = null; S.fixOpen = false;
    b.weServe = b.set === 5 ? null : last.oppServe; // chi ha ricevuto per primo nel set prima, batte per primo
    window.scrollTo({ top: 0 });
  }
  else if (act === 'newmatch') { S.bench = freshBench(); invalidate(); }
  else return false;
  return true;
}

// ---------- render ----------
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const main = $('#main');
  if (!S.matches.length && S.tab !== 'data') { main.innerHTML = `<section class="panel"><h2>No matches loaded</h2><p class="note" style="margin-bottom:12px">Go to the Data tab and load the .dvw files of your matches and your opponent's. They stay on this device only.</p><button class="btn" data-tab="data">Go to Data</button></section>`; save(); return; }
  if (S.tab === 'bench') main.innerHTML = renderBench();
  else if (S.tab === 'study') main.innerHTML = renderStudy();
  else main.innerHTML = renderData();
  save();
}

const chip = (attr, val, cur, label, cls = '') => `<button class="chip ${cls}" data-${attr}="${val}" aria-pressed="${String(cur === val)}">${label}</button>`;
const pChips = (attr, cur, cls) => [1, 2, 3, 4, 5, 6].map(i => chip(attr, i, cur, 'P' + i, cls)).join('');

function rotTable(key, st) {
  const rows = [1, 2, 3, 4, 5, 6].map(i => {
    const r = st.rot[i]; const so = r.soN ? r.soW / r.soN : null, bp = r.bpN ? r.bpW / r.bpN : null;
    const cls = (v, avg) => v == null ? '' : v - avg >= 0.08 ? 'hi' : avg - v >= 0.08 ? 'lo' : '';
    const cell = (v, n, avg) => `<td class="r"><span class="pct"><s style="width:${v == null ? 0 : Math.round(v * 40)}px"></s><span class="num ${cls(v, avg)}">${pc(v)}</span></span> <span class="n num">${n}</span></td>`;
    return `<tr><td><b class="rh">P${i}</b></td>${cell(so, r.soN, st.so)}${cell(bp, r.bpN, st.bp)}</tr>`;
  }).join('');
  return `<div class="panel"><h3>${esc(teamName(key))}</h3><div class="tbl-wrap"><table>
    <thead><tr><th>Rot.</th><th class="r">Side-out</th><th class="r">Break point</th></tr></thead>
    <tbody>${rows}<tr><td><b>Tot</b></td><td class="r num">${pc(st.so)} <span class="n">${st.soN}</span></td><td class="r num">${pc(st.bp)} <span class="n">${st.bpN}</span></td></tr></tbody></table></div></div>`;
}

function findings(rows) {
  const p = RC.patterns(rows);
  if (!p.n) return `<p class="empty">No sets for this team in the loaded files.</p>`;
  const L = [];
  const t = p.top, tr = t === 6 ? 1 : t + 1;
  L.push([p.topShare >= 0.6, `Usual alignment: goes to its first serve in <b>P${t}</b> in <b>${p.eq[t]} of ${p.n} sets</b>. In practice it starts in P${t} when serving and in P${tr} when receiving.`]);
  const list = o => [1, 2, 3, 4, 5, 6].filter(i => o[i]).map(i => `P${i} ×${o[i]}`).join(', ') || '–';
  L.push([false, `When serving first: ${list(p.serve)}. When receiving first: ${list(p.recv)}.`]);
  if (p.nW + p.nL) {
    const kw = p.nW ? p.keepW / p.nW : null, kl = p.nL ? p.keepL / p.nL : null;
    let read = '';
    if (kw != null && kl != null) {
      if (kw >= 0.7 && kl >= 0.7) read = ' Does not change based on the result.';
      else if (kw >= 0.6 && kl < 0.5) read = ' Keeps it after a win, changes after a loss.';
      else if (kw < 0.5 && kl < 0.5) read = ' Changes often between sets.';
    }
    L.push([read === ' Does not change based on the result.' || read.startsWith(' Keeps'), `After a set won it keeps the alignment ${p.keepW}/${p.nW} times, after a set lost ${p.keepL}/${p.nL}.${read}`]);
  }
  const diff = Object.entries(p.byOpp).map(([o, rs]) => {
    const c = {}; rs.forEach(r => c[r.eq] = (c[r.eq] || 0) + 1);
    const mode = +Object.keys(c).sort((a, b) => c[b] - c[a])[0];
    return { o, rs, mode };
  });
  const odd = diff.filter(d => d.mode !== t);
  L.push([odd.length > 0, odd.length ? `Against ${odd.map(d => `<b>${esc(d.o)}</b> (alignment P${d.mode} at first serve)`).join(', ')} it changed from the usual: a sign of adapting to the opponent.` : `Uses the same alignment against every opponent in the files (${diff.length}).`]);
  if (p.follow) L.push([false, `In ${p.follow} of ${p.nFollow} cases it shifted its start to recreate the previous set's matchup against the opponent.`]);
  return `<ul class="findings">${L.map(([s, x]) => `<li class="${s ? 'strong' : ''}">${x}</li>`).join('')}</ul>`;
}

function heatColor(v, mean, dev) {
  const d = (v - mean) / dev; const amt = Math.min(70, Math.abs(d) * 70);
  return `color-mix(in oklab, var(${d >= 0 ? '--good' : '--bad'}) ${amt.toFixed(0)}%, var(--sunk))`;
}

function renderStudy() {
  if (S.myKey === S.oppKey) return `<section class="panel"><p class="warn">Pick two different teams at the top.</p></section>`;
  const m = model();
  const M = mat(S.studyServe, 25);
  const vals = []; for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) vals.push(M[a][b]);
  const mean = vals.reduce((s, v) => s + v, 0) / 36, dev = Math.max(0.03, ...vals.map(v => Math.abs(v - mean)));
  let heat = `<span></span>${[1, 2, 3, 4, 5, 6].map(b => `<span class="h">Them P${b}</span>`).join('')}`;
  for (let a = 1; a <= 6; a++) {
    heat += `<span class="rh">P${a}</span>` + [1, 2, 3, 4, 5, 6].map(b => `<button data-cell="${a}-${b}" aria-pressed="${String(S.sel === a + '-' + b)}" style="background:${heatColor(M[a][b], mean, dev)}" aria-label="Us P${a} vs them P${b}: ${pc(M[a][b])}">${Math.round(M[a][b] * 100)}</button>`).join('');
  }
  let phases = '';
  if (S.sel) {
    const [a, b] = S.sel.split('-').map(Number);
    phases = `<h3 style="margin-top:16px">Player matchups: us P${a} vs them P${b}, ${S.studyServe === 0 ? 'we serve first' : 'they serve first'}</h3>` + phaseNets(a, b, S.studyServe, M);
  }
  let planA, planB, planLabel;
  if (S.sel) { [planA, planB] = S.sel.split('-').map(Number); planLabel = `Selected matchup: us P${planA} vs them P${planB}, ${S.studyServe === 0 ? 'we serve first' : 'they serve first'}.`; }
  else {
    const pr = RC.predict(RC.startHistory(S.matches, S.oppKey), { set: 1, oppServeFirst: S.studyServe === 1 });
    planB = [1, 2, 3, 4, 5, 6].sort((x, y) => pr.dist[y] - pr.dist[x])[0];
    const ex = a => [1, 2, 3, 4, 5, 6].reduce((t, x) => t + pr.dist[x] * M[a][x], 0);
    planA = [1, 2, 3, 4, 5, 6].sort((x, y) => ex(y) - ex(x))[0];
    planLabel = `Recommended start P${planA} against their most likely P${planB} (set 1, ${S.studyServe === 0 ? 'we serve first' : 'they serve first'}). Tap a cell in the table for another matchup.`;
  }
  const key = S.hist === 'opp' ? S.oppKey : S.myKey;
  const rows = RC.startHistory(S.matches, key);
  const coach = coachOf(S.oppKey);
  const anyMy = m.A.st.soN + m.A.st.bpN, anyOpp = m.B.st.soN + m.B.st.bpN;
  const jumps = [['st-pattern', 'Pattern'], ['st-matchup', 'Matchup'], ['st-battuta', 'Serve plan'], ['st-alzata', 'Setter'], ['st-battitrici', 'Serve & pass'], ['st-rot', 'Rotations'], ['st-rose', 'Players'], ['st-storico', 'History']];
  return `
  <nav class="jump" aria-label="Study sections">${jumps.map(([id, l]) => `<button class="chip wide" data-jump="${id}">${l}</button>`).join('')}</nav>

  <section class="panel" id="st-pattern">
    <h2>${esc(teamName(S.oppKey))} pattern${coach ? ` <span class="n" style="font-family:var(--f-body);text-transform:none;font-size:14px;font-weight:500">coach ${esc(coach)}</span>` : ''}</h2>
    ${findings(RC.startHistory(S.matches, S.oppKey))}
  </section>

  <section class="panel" id="st-matchup">
    <h2>Starting rotation matchup</h2>
    <div class="row" style="margin-bottom:12px"><div class="field"><span class="lbl">Serving first</span><div class="chips">${chip('sserve', 0, S.studyServe, 'Us', 'wide')}${chip('sserve', 1, S.studyServe, 'Them', 'wide')}</div></div></div>
    <div class="tbl-wrap"><div class="heat">${heat}</div></div>
    <div class="legend"><span>Chance of winning the set (%). Rows: our start.</span><span>worse</span><i></i><span>better than the table average</span></div>
    ${phases || '<p class="note" style="margin-top:10px">Tap a cell to see the player-by-player matchups, rotation by rotation.</p>'}
    ${(!anyMy || !anyOpp) ? '<p class="warn" style="margin-top:10px">One of the two teams has no rallies in the files: the average of all loaded matches is used for it.</p>' : ''}
  </section>

  <section class="panel" id="st-battuta">
    <h2>Serve plan</h2>
    <p class="note" style="margin-bottom:10px">${planLabel}</p>
    ${servePlan(planA, planB, S.studyServe)}
  </section>

  <section class="panel" id="st-alzata">
    <h2>Setter distribution</h2>
    ${setSection()}
  </section>

  <div id="st-battitrici">${serveTables()}</div>


  <section class="grid2" id="st-rot">${rotTable(S.myKey, m.A.st)}${rotTable(S.oppKey, m.B.st)}</section>
  <section style="display:grid;gap:18px" id="st-rose">${rosterTable(S.myKey, people().my)}${rosterTable(S.oppKey, people().opp)}</section>
  <p class="note">Rotation = setter position (P1 = setter in zone 1), as in DataVolley. The small numbers are rallies played in that rotation; the model pulls toward the team average when there are few.</p>

  <section class="panel" id="st-storico">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0">Starting rotation history</h2>
      <div class="chips">${chip('hist', 'opp', S.hist, esc(teamName(S.oppKey)), 'wide')}${chip('hist', 'my', S.hist, esc(teamName(S.myKey)), 'wide')}</div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Against</th><th>Set</th><th>Start</th><th>Began</th><th>At serve</th><th>Opponent</th><th class="r">Score</th></tr></thead>
      <tbody>${rows.map((r, i) => { const eq = RC.eqRot(r.start, r.serveFirst); const first = i === 0 || rows[i - 1].match !== r.match;
        return `<tr${first && i ? ' style="border-top:2px solid var(--line)"' : ''}><td class="num">${first ? fmtDate(r.date) : ''}</td><td>${first ? esc(r.opp) : ''}</td><td class="num">${r.set}</td><td><b>P${r.start}</b></td><td>${r.serveFirst ? 'Serving' : 'Receiving'}</td><td>P${eq}</td><td>P${r.oppStart}</td><td class="r"><span class="tag ${r.won ? 'w' : r.won === false ? 'l' : ''}">${r.score.join('-')}</span></td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">No data</td></tr>'}</tbody>
    </table></div>
    <p class="note" style="margin-top:8px">"At serve" is the rotation the team is in at its first serve: a team receiving in P2 that sides out serves in P1, so it is the same alignment as starting in P1 on serve.</p>
  </section>`;
}

function renderData() {
  const list = S.matches.map((m, i) => `<div class="match"><span class="t"><b>${esc(m.teams[0].name)}</b> – <b>${esc(m.teams[1].name)}</b><br><span class="n">${fmtDate(m.date)} · ${m.sets.map(s => s.final.join('-')).join(', ')} · ${esc(m.competition)}</span></span><button class="btn sec small" data-del="${i}">Remove</button></div>`).join('');
  return `
  <section class="panel">
    <h2>DataVolley files</h2>
    <label class="drop" id="drop" for="fileIn">
      <b>Drop .dvw files here or tap to choose them</b>
      <span class="note">You can load several at once. Files stay on this device.</span>
      <input id="fileIn" type="file" accept=".dvw" multiple hidden>
    </label>
    <p class="note" id="loadMsg" style="margin-top:8px"></p>
  </section>
  <section class="panel">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin:0">Loaded matches (${S.matches.length})</h2>
      ${S.customData && SAMPLE.length ? '<button class="btn sec small" data-act="reset">Restore the 7 original matches</button>' : ''}
    </div>
    <div class="matches">${list || '<p class="empty">No matches.</p>'}</div>
  </section>`;
}

async function addFiles(files) {
  const msg = []; let added = 0;
  for (const f of files) {
    try {
      const txt = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f, 'windows-1252'); });
      const m = RC.parseDVW(txt, f.name);
      if (!m.sets.length) { msg.push(`${f.name}: no sets with rallies found.`); continue; }
      if (S.matches.some(x => x.id === m.id)) { msg.push(`${f.name}: already loaded.`); continue; }
      S.matches = S.matches.concat([m]); added++;
    } catch (e) { msg.push(`${f.name}: could not read the file (${e.message}).`); }
  }
  if (added) { S.customData = true; invalidate(); ensureTeams(); }
  render();
  const el = $('#loadMsg'); if (el) el.textContent = `${added} matches added.` + (msg.length ? ' ' + msg.join(' ') : '');
}

// ---------- eventi ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset, b = S.bench;
  if (d.tab) { S.tab = d.tab; window.scrollTo({ top: 0 }); return render(); }
  if (d.jump) { const el = document.getElementById(d.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (S.tab === 'bench' && benchClick(d, t)) return render();
  if (false) {}
  else if (d.sserve) { S.studyServe = +d.sserve; }
  else if (d.cell) S.sel = S.sel === d.cell ? null : d.cell;
  else if (d.hist) S.hist = d.hist;
  else if (d.srot) S.srot = +d.srot;
  else if (d.sland != null) S.sland = +d.sland;
  else if (d.sq) S.sq = d.sq;
  else if (d.del != null) { S.matches = S.matches.filter((_, i) => i !== +d.del); S.customData = true; invalidate(); ensureTeams(); }
  else if (d.act === 'reset') { S.matches = SAMPLE; S.customData = false; invalidate(); ensureTeams(); }
  else return;
  render();
});
document.addEventListener('toggle', e => { if (e.target.id === 'benchPlayers') S.playersOpen = e.target.open; if (e.target.id === 'benchNets') S.netsOpen = e.target.open; if (e.target.id === 'benchPlan') S.planOpen = e.target.open; if (e.target.id === 'benchSet') S.setOpen = e.target.open; }, true);
document.addEventListener('change', e => {
  if (e.target.id === 'selMy') { S.myKey = e.target.value; S.sel = null; invalidate(); ensureTeams(); render(); }
  if (e.target.id === 'selOpp') { S.oppKey = e.target.value; S.sel = null; invalidate(); ensureTeams(); render(); }
  if (e.target.id === 'fileIn') addFiles([...e.target.files]);
  if (e.target.dataset && e.target.dataset.bpl) {
    const side = e.target.dataset.bpl, i = +e.target.dataset.i, b = S.bench, base = people(true)[side];
    const rot = side === 'my' ? (b.myPick || +document.querySelector('[data-bact=confirm]')?.dataset.v || 1) : (b.oppReal || +(document.querySelector('.tcard.pred .tbig b')?.textContent || 'P1').slice(1));
    const cur = (b.ovr && b.ovr[side] && b.ovr[side + 'Rot'] === rot) ? b.ovr[side].slice() : (base.L[rot] ? base.L[rot].zones.slice() : [0, 0, 0, 0, 0, 0]);
    cur[i] = +e.target.value; b.ovr = Object.assign({}, b.ovr || {}, { [side]: cur, [side + 'Rot']: rot }); render();
  }
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('#drop'); if (!z) return;
  e.preventDefault(); z.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop') addFiles([...e.dataTransfer.files].filter(f => /\.dvw$/i.test(f.name)));
}));

ensureTeams();
render();

</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
